<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cardshark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/svg+xml" href="icons/mark.svg">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Cardshark</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#243B42">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700;800&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: one-screen card table on baize, walnut rail, brass accents; home is a scrolling menu of two games */
:root{
  --felt:#1c4a3a; --felt-hi:#24604b; --felt-lo:#123228;
  --rail:#3a2416; --rail-hi:#5c3a24;
  --ink:#f3ecd9; --muted:#a8c0b2; --faint:rgba(243,236,217,.14);
  --brass:#d6ab52; --brass-ink:#2b1b08; --trump:#e23a34; --alert:#e9876a; --good:#9fd49a;
  --sheet:#f6efdd; --sheet-ink:#2a2118; --sheet-line:#c9bb98; --sheet-muted:#7a6a52;
  --display:"Alegreya SC", "Palatino Linotype", Georgia, serif;
  --body:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
html,body{height:100%}
body{margin:0;background:#243B42;color:var(--ink);font-family:var(--body);font-size:16px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
#app{height:100%;box-sizing:border-box;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  background:#243B42;}
.svgc svg{display:block;width:100%;height:auto}
.ci{display:block;width:100%;background-repeat:no-repeat}
.scard .sf .ci,.scard .sb .ci{width:100%;height:100%}
.fbacks{display:flex;gap:10px;margin:8px 0 2px}
.fback{flex:1;max-width:64px;padding:0;border:0;background:none;border-radius:8px;cursor:pointer;opacity:.55}
.fback[aria-pressed="true"]{opacity:1;outline:3px solid var(--brass);outline-offset:2px}
.fback .ci{height:auto!important;width:100%}
.ci.back{box-sizing:border-box;border-radius:7%/4.5%;border:2px solid #f3ecd9}
.ci.back.b{background:radial-gradient(circle at 50% 50%,#f3ecd9 0 9%,transparent 10%),repeating-linear-gradient(45deg,#1b2e5c 0 5px,#2b4a8a 5px 6px),#1b2e5c}
.ci.back.h{background:radial-gradient(circle at 50% 50%,#e8d7a8 0 9%,transparent 10%),repeating-linear-gradient(-45deg,#7a221d 0 5px,#9b2f27 5px 10px),#8e2a24}
.set{display:flex;align-items:center;justify-content:center;gap:8px}
.decks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.deck{display:flex;flex-direction:column;gap:8px;align-items:center;background:#fff;border:1.5px solid var(--sheet-line);border-radius:12px;padding:10px 8px;cursor:pointer;color:var(--sheet-ink);font:inherit;text-align:center}
.deck[aria-pressed="true"]{border-color:var(--felt);box-shadow:0 0 0 2px var(--felt)}
.dk-cards{display:flex;justify-content:center;height:84px;align-items:flex-end}
.dk-cards .svgc{width:44px;margin-left:-8px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.dk-cards .svgc:first-child{margin-left:0}
.dk-name{display:flex;flex-direction:column;line-height:1.2}
.dk-name small{color:var(--sheet-muted);font-size:12.5px}
.seg.dark button{background:#fff;border-color:var(--sheet-line);color:var(--sheet-ink)}
.seg.dark button[aria-pressed="true"]{background:var(--felt);color:var(--ink);border-color:var(--felt)}
.credit{font-size:12.5px;margin-top:16px}
.namef{display:flex;flex-direction:column;gap:4px;margin:4px 0 10px;font-size:13px;color:var(--sheet-muted);font-weight:700}
.namef input{font:600 16px var(--ui,inherit);padding:10px 12px;border-radius:10px;border:1px solid var(--sheet-line);background:#fff;color:var(--sheet-ink)}
.tlist{display:flex;flex-direction:column;gap:8px;max-height:38vh;overflow:auto;margin:6px 0}
.trow{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:baseline;text-align:left;background:#e6f1e9;border:1px solid #9ab8a0;border-radius:12px;padding:10px 12px;color:var(--sheet-ink);cursor:pointer;box-shadow:0 2px 5px rgba(42,33,24,.1)}
.trow:active{background:#dcebdd}
.trow b{font-size:16px}.trow small{color:var(--sheet-muted);font-size:12.5px}.trow .tseats{grid-column:1/3;font-size:13.5px}.trow .thost{display:block;margin-bottom:3px;color:var(--sheet-muted);font-size:12px}.trow .thost b{color:#245b3d;font-size:15px}
.wtable{display:grid;grid-template-rows:auto auto auto;gap:10px;margin:12px 0;justify-items:center}
.wtable.wn{grid-template-rows:none;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.wtable.wn .wseat{width:100%;min-width:0}
.w13{display:flex;gap:8px;width:100%;justify-content:space-between;align-items:center}.w13 .wseat{width:36%;min-width:0}
.wfelt{flex:1;align-self:stretch;min-height:58px;border-radius:50%/45%;background:radial-gradient(100% 90% at 50% 40%,#2a7a5c,#14432f);border:4px solid #5a3a22;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.wseat{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:46%;padding:10px 8px;border-radius:12px;border:2px dashed #3e9a6c;background:#e3f4ea;color:#17603e;cursor:pointer;transition:transform .1s,box-shadow .15s}
.wseat.inactive{visibility:hidden;pointer-events:none}
.wseat:not(.taken):active{transform:scale(.97)}
.wseat small{font-size:11px;color:inherit;opacity:.75;font-weight:700;text-transform:uppercase;letter-spacing:.06em;min-height:1em}
.wseat b{font-size:15px;display:flex;align-items:center;gap:5px}
.wseat.free b::before{content:"+";display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:#3e9a6c;color:#fff;font-size:15px;line-height:1}
.wseat.taken{border:2px solid #c99a3e;background:#f7ebcd;color:#5a3a0c;cursor:default}
.wseat.partner{border-color:#7192ad;background:#e7eff5;color:#294760}
.wseat.opponent{border-color:#c97a62;background:#f8e7df;color:#653224}
.wseat.me{border:2px solid var(--brass);background:#1d4a3a;color:#fff;box-shadow:0 0 0 3px rgba(214,171,82,.45),0 4px 12px rgba(0,0,0,.25)}
.wseat.me small{opacity:.85;color:var(--brass)}
.robo{width:15px;height:15px;margin-left:5px;vertical-align:-2px;color:var(--brass);flex:none}
#awayPill{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:8;background:var(--brass);color:var(--brass-ink);border:0;border-radius:99px;padding:10px 16px;font-weight:700;font-size:14px;box-shadow:0 6px 18px rgba(0,0,0,.45);white-space:nowrap;cursor:pointer}
table.stats{width:100%;border-collapse:separate;border-spacing:4px;table-layout:fixed;margin:2px 0 8px}
table.stats th{font-size:12px;font-weight:700;color:var(--sheet-muted);text-align:center;padding:2px}
table.stats tbody th{text-align:left}
table.stats th.corner{font-size:10px;line-height:1.15;text-align:left;font-weight:600}
table.stats th.corner span{display:block}table.stats th.corner span:last-child{text-align:right}
table.stats td{background:rgba(0,0,0,.05);border-radius:8px;text-align:center;padding:7px 2px;font-variant-numeric:tabular-nums}
table.stats td b{display:inline-block;min-width:1.4em;font-size:15px}
.sw{color:#2e7d4f}.sl{color:#b0302a}.se{color:var(--sheet-muted)}
.seg.levels{display:grid;grid-template-columns:repeat(4,1fr)}.seg.levels button{padding-left:2px;padding-right:2px;font-size:14px;min-width:0}
.ix{font:700 12px Georgia, "Times New Roman", serif} .ixr{font:700 12px Georgia, "Times New Roman", serif}
.lbl{font:800 7.2px var(--display);text-anchor:middle;letter-spacing:.4px}

/* ---------- HOME ---------- */
#home{height:100%;overflow-y:auto;padding-block:14px 18px;box-sizing:border-box;background:#243B42}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;flex-direction:column-reverse;gap:10px;padding-top:2px}
.brand .lang{align-self:flex-end}
.bl{display:flex;align-items:flex-end;gap:12px;min-width:0}
.logo{width:clamp(64px,19vw,92px);aspect-ratio:1;flex:none;border-radius:22%;background:var(--felt);overflow:hidden;display:flex;align-items:flex-end;justify-content:center;box-shadow:inset 0 0 0 1px var(--faint)}
.logo svg{width:88%;margin-bottom:-2px}
.brand h1{font:800 clamp(36px,11vw,60px)/.9 var(--display);margin:0;color:var(--ink)}
.brand h1 span{color:var(--brass)}
.brand p{margin:6px 0 0;color:var(--muted);font-size:14px;max-width:26ch}
.lang{display:flex;border:1px solid var(--faint);border-radius:99px;overflow:hidden;flex:none}
.lang button{background:none;border:0;padding:7px 12px;font-weight:700;font-size:13px;letter-spacing:.06em;color:var(--muted);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--brass);color:var(--brass-ink)}
.game{background:linear-gradient(180deg, rgba(0,0,0,.18), rgba(0,0,0,.28));border:1px solid var(--faint);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.game-top{display:flex;gap:14px;align-items:center}
.fan{position:relative;width:118px;height:96px;flex:none}
.fan .svgc{position:absolute;width:52px;bottom:4px;left:30px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.4));transform-origin:50% 120%}
.game h2{font:800 30px/1 var(--display);margin:0}
.game .sub{color:var(--muted);font-size:14px;margin:4px 0 0;line-height:1.35}
.opt{display:flex;flex-direction:column;gap:6px}
.opt>span{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 auto;min-width:64px;background:rgba(0,0,0,.22);border:1px solid var(--faint);border-radius:10px;padding:9px 10px;cursor:pointer;font-size:15px;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--felt-lo);border-color:var(--ink);font-weight:700}
.note{font-size:13px;color:var(--muted);margin:0}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--ink);cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--brass);margin:0;flex:none}
.play{background:var(--brass);color:var(--brass-ink);border:0;border-radius:12px;padding:13px 16px;font:800 20px var(--display);letter-spacing:.04em;cursor:pointer;box-shadow:0 3px 0 #8a6a28}
.play:active{transform:translateY(2px);box-shadow:0 1px 0 #8a6a28}
.prefs{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ghost{background:none;border:1px solid var(--faint);border-radius:12px;padding:11px;color:var(--ink);cursor:pointer;font-weight:700}
.foot{color:var(--muted);font-size:12.5px;text-align:center;margin:0}
/* home: two posters */
#home .wrap{min-height:100%;box-sizing:border-box;gap:12px;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:min-content;align-content:start}
#home .hbar{grid-column:1/-1}
#table.online #bOpts,#table:not(.online) #bRules{display:none}
.rejoin{grid-column:1/-1;display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:12px;background:var(--brass);color:var(--brass-ink);font:800 16px var(--display);cursor:pointer;box-shadow:0 3px 0 #8a6a28}
.rejoin svg{width:20px;height:20px}
#home .poster{flex:none;min-height:0;aspect-ratio:3/4;border-radius:20px}
#home .pfan{height:38%;top:8%}
#home .pcap{padding:12px;flex-direction:column;align-items:center;gap:8px;text-align:center}
#home .pcap b{font-size:clamp(22px,6.4vw,30px)}
#home .go{width:38.4px;height:38.4px}
#home .go svg{width:19.8px;height:19.8px}
.rules-list{display:flex;flex-direction:column;gap:2px}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 2px;border-bottom:1px dashed var(--sheet-line);cursor:pointer}
.tog:last-child{border-bottom:0}
.tog b{display:block;font-size:15px}
.tog small{display:block;font-size:12.5px;color:var(--sheet-muted);line-height:1.3}
.tog input{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:13px;background:#d8cdb2;position:relative;flex:none;cursor:pointer;margin:0;transition:background .15s}
.tog input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:left .15s}
.tog input:checked{background:var(--felt)}
.tog input:checked::after{left:21px}
.tog input:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.sigs{display:flex;gap:6px;justify-content:center;width:100%}
.sig{background:rgba(0,0,0,.25);border:1px solid var(--faint);border-radius:99px;padding:6px 14px;font-weight:700;font-size:14px;cursor:pointer;color:var(--ink)}
.sig[aria-pressed="true"]{background:var(--brass);color:var(--brass-ink);border-color:var(--brass)}
.mini-card{display:inline-block;width:34px;vertical-align:middle;margin-left:4px}
.hbar{display:flex;align-items:center;gap:10px;flex:none}
.hbar .logo{width:46px;height:46px;border-radius:12px}
.hbar h1{flex:1;min-width:0;margin:0;font:800 clamp(18px,6.2vw,34px)/1 var(--display);color:var(--ink);white-space:nowrap;overflow:hidden}
.hbar h1 span{color:var(--brass)}
.hbar .ib{width:42px;height:42px;flex:none}
.hbar .logo{flex:none}
.hbar{gap:8px}
.poster{position:relative;display:block;width:100%;flex:1 1 0;min-height:150px;border-radius:24px;overflow:hidden;border:1px solid var(--faint);padding:0;color:var(--ink);font:inherit;text-align:left;box-shadow:0 8px 22px rgba(0,0,0,.3)}
.poster.pb{background:radial-gradient(90% 90% at 50% 18%,#1d8188,#0a363c)}
.poster.pt{background:radial-gradient(90% 90% at 50% 18%,#2f5a97,#13274a)}
/* solitaire */
.poster.ps{background:radial-gradient(90% 90% at 50% 18%,#5e3f86,#24153d)}
#sol{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;background:radial-gradient(120% 90% at 50% 30%,#2a5c48,#13362a);touch-action:none;user-select:none;-webkit-user-select:none;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#sol[hidden]{display:none}
.sbar{display:flex;gap:6px;align-items:center;padding:8px 8px 4px;flex:none}
.sbar .sstat{flex:1;justify-content:center;gap:5px;padding:5px 6px}
.sbar .sstat b{font-size:15px}
.sboard{position:relative;flex:1;max-width:620px;width:100%;margin:0 auto;overflow:hidden}
.slot{position:absolute;width:var(--scw);height:var(--sch);border-radius:calc(var(--scw)*0.08);border:1.5px solid rgba(255,255,255,.18);box-sizing:border-box}
.slot.found::after{content:"A";position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.2);font:700 calc(var(--scw)*0.4) var(--display)}
.slot[data-slot="stock"].recycle::after{content:"↻";position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.45);font-size:calc(var(--scw)*0.55)}
.slot[data-slot="stock"].done::after{content:"✕";position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.2);font-size:calc(var(--scw)*0.4)}
.slot.nowaste{border-color:transparent}
.scard{position:absolute;left:0;top:0;width:var(--scw);height:var(--sch);transition:transform .22s cubic-bezier(.2,.8,.3,1);will-change:transform;cursor:pointer;border-radius:calc(var(--scw)*0.06);box-shadow:0 1px 2px rgba(0,0,0,.35)}
.scard.instant{transition:none}
.scard.drag{transition:none;box-shadow:0 10px 22px rgba(0,0,0,.45)}
.scard svg{width:100%;height:100%;display:block}
.scard .sf{display:none;width:100%;height:100%}.scard .sb{width:100%;height:100%}
.scard.up .sf{display:block}.scard.up .sb{display:none}
.scard.pick{outline:3px solid #fff;outline-offset:1px}
.scard.hint,.slot.hint{outline:3px solid var(--brass);outline-offset:1px;border-radius:calc(var(--scw)*0.06)}
.sfoot{display:flex;justify-content:space-around;gap:4px;padding:6px 8px 10px;flex:none}
.sbtn{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;color:var(--ink);font:600 12px var(--ui,inherit);padding:4px 10px;cursor:pointer;min-width:64px}
.sbtn svg{width:24px;height:24px}
.sbtn:disabled{opacity:.35}
.sbtn[hidden]{display:none}
/* match result animations (cardshark mark only) */
#fx{position:fixed;inset:0;z-index:19;overflow:hidden;cursor:pointer;touch-action:manipulation}
#fx .fxt{position:absolute;left:0;right:0;text-align:center;font-weight:900;letter-spacing:.04em;color:var(--brass,#e8c36a);font-size:clamp(34px,11vw,64px);text-shadow:0 3px 0 rgba(0,0,0,.55),0 0 22px rgba(0,0,0,.6);pointer-events:none}
#fx .fxwin{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,2.5vh,22px);pointer-events:none;--s:clamp(62px,21vw,108px)}
#fx .fxwin .fxt{position:static}
#fx .fxrow{display:grid;grid-template-columns:repeat(3,var(--s));gap:clamp(4px,2vw,16px);align-items:end;justify-items:center}
#fx .fxs{width:var(--s);height:var(--s);position:relative;animation:fxdance .56s ease-in-out infinite alternate;transform-origin:50% 90%}
#fx .fxs .fxmark{width:100%;height:100%;display:block;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}
#fx .fxs.big{width:calc(var(--s)*1.2);height:calc(var(--s)*1.2);margin-top:calc(var(--s)*-.1)}
#fx .fxs.big .mar{position:absolute;width:26%;top:8%;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5));transform-origin:50% 95%}
#fx .mar.l{left:-14%;animation:fxshl .18s ease-in-out infinite alternate}
#fx .mar.r{right:-14%;animation:fxshr .18s ease-in-out infinite alternate}
#fx .fxs.big .fxarm{position:absolute;top:34%;width:35%;height:22%;overflow:visible;z-index:1;fill:#5b7186;stroke:#0e241c;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#fx .fxs.big .fxarm.l{left:-5%}
#fx .fxs.big .fxarm.r{right:-5%;transform:scaleX(-1)}
#fx .fxs.big .mar{z-index:2}
#fx .spark{position:absolute;width:6px;height:6px;border-radius:50%;pointer-events:none}
#fx .fxlose{position:absolute;inset:0;pointer-events:none}
#fx .fxlose .fxt{top:38%}
#fx .fxshark{position:absolute;pointer-events:none;filter:drop-shadow(0 6px 8px rgba(0,0,0,.5))}
#fx .fxshark .fxmark{width:100%;height:100%;display:block}
#fx .fxjaw{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#fx .fxjaw .fxgape{fill:#14291f}
#fx .fxjaw .fxteeth{fill:none;stroke:#fbf6ea;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#fx .fxjaw .fxlower{fill:#5b7186;stroke:#0e241c;stroke-width:2;stroke-linejoin:round;transform-box:view-box;transform-origin:84px 70px}
@keyframes fxdance{from{transform:translateY(0) rotate(-9deg)}to{transform:translateY(-12%) rotate(9deg)}}
@keyframes fxshl{from{transform:rotate(-30deg)}to{transform:rotate(18deg)}}
@keyframes fxshr{from{transform:rotate(30deg)}to{transform:rotate(-18deg)}}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--sheet);color:var(--sheet-ink);padding:10px 16px;border-radius:12px;font-weight:700;z-index:50;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.poster.ph{background:radial-gradient(90% 90% at 50% 18%,#9a2e2b,#43110f)}
.pfan{position:absolute;left:50%;top:7%;height:62%;width:0}
.pfan .svgc{position:absolute;bottom:0;height:100%;width:auto;aspect-ratio:auto;left:0;transform-origin:50% 110%;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45));
  transform:translateX(calc(-50% + var(--i) * 34%)) rotate(calc(var(--i) * 14deg))}
.pfan .svgc .ci{height:100%;width:auto}
.pfan .svgc > svg{height:100%;width:auto;aspect-ratio:240/336;display:block}

.btns .sec{background:transparent;border:1.5px solid var(--sheet-line);color:var(--sheet-ink)}
table.pis{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;margin-top:8px}
.pis th{font:800 20px var(--display);border-bottom:2px solid var(--sheet-ink);padding:4px 6px}
.pis td{padding:6px;border-bottom:1px dashed var(--sheet-line);text-align:center;font-size:17px}
.pis td.n{color:var(--sheet-muted);font-size:13px;width:28px;text-align:left}
.pis td.note{font-size:12.5px;color:var(--sheet-muted);text-align:left;line-height:1.25}
.pis tr.tot td{border-bottom:0;border-top:2px solid var(--sheet-ink);font:800 22px var(--display)}
.pis .x{color:#b4432c;font-weight:700}
.pisw{overflow-x:auto}
.trickview{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
.trickview figure{margin:0;width:68px;text-align:center;font-size:12px;color:var(--sheet-muted)}
.trickview figure.w{color:var(--sheet-ink);font-weight:800}
.trickview figure.w .svgc{outline:3px solid var(--brass);border-radius:9px}
.decl{display:flex;flex-direction:column;gap:4px;margin:8px 0}
.decl div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--sheet-line);padding:4px 0}
.rank{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px 14px;font-size:14.5px;margin:6px 0}
.rank div{display:flex;justify-content:space-between;border-bottom:1px dashed var(--sheet-line)}
/* colour game */
.poster.pu{background:radial-gradient(90% 90% at 50% 18%,#d39a22,#6b4306)}
.poster.pu .pfan .svgc > svg{aspect-ratio:60/90}
#uno{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;background:#2c3652;user-select:none;-webkit-user-select:none;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);overflow:hidden;--pw:min(22vw,104px,14vh)}
#uno[hidden]{display:none}
#uno[data-n="5"],#uno[data-n="6"]{--pw:min(20vw,96px,13vh)}
.ubar{display:flex;align-items:center;gap:8px;padding:8px 8px 4px;flex:none}
.ubar .chip.score{margin:0 auto;gap:6px}
.ubar .chip small{color:var(--muted);font-size:12px}
.utable{position:relative;flex:1;min-height:0;display:flex}
.utable .ucenter{flex:1}
.uopps{position:absolute;inset:0;z-index:2;pointer-events:none;--sw:min(24vw,96px)}
.uopp{position:absolute;width:var(--sw);box-sizing:border-box;left:clamp(4px,calc(var(--x) * 1% - var(--sw) / 2),calc(100% - var(--sw) - 4px));top:calc(var(--y) * 1%);transform:translateY(-50%);pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:14px;border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.2);min-width:0;transition:box-shadow .2s,border-color .2s}
.uopp.turn{border-color:var(--brass);box-shadow:0 0 0 2px var(--brass) inset,0 0 16px rgba(214,170,80,.35)}.uopp.eliminated{opacity:.42;filter:grayscale(1)}
.ufan{position:relative;height:46px;width:100%}
.umini{position:absolute;top:0;width:30px;height:45px;left:calc(50% - 15px + (var(--i) - (var(--k) - 1) / 2) * min(8px, 40px / max(var(--k) - 1, 1)))}
.umini svg{width:100%;height:100%;display:block}
.uname{display:flex;align-items:center;gap:4px;font-size:13px;max-width:100%}
.uname b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ucount{background:rgba(255,255,255,.16);border-radius:99px;padding:0 6px;font-weight:800;font-size:12px;flex:none}
.ulast{background:#d8382e;color:#fff;border-radius:99px;padding:0 6px;font-weight:900;font-size:12px;flex:none}
.upts{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.ucatch{position:absolute;left:4px;right:4px;bottom:-12px;background:#d8382e;color:#fff;border:0;border-radius:10px;padding:7px 2px;font:900 14px var(--display);animation:upulse .5s infinite alternate;z-index:3;cursor:pointer}
@keyframes upulse{to{transform:scale(1.08)}}
.ucenter{position:relative;flex:1;display:flex;align-items:center;justify-content:center;gap:24px;min-height:0}
.udir{position:absolute;width:min(80vw,310px,34vh);aspect-ratio:1;left:50%;top:50%;transform:translate(-50%,-50%);opacity:.7;pointer-events:none;transition:color .3s;filter:drop-shadow(0 0 8px currentColor)}
.udir.ccw{transform:translate(-50%,-50%) scaleX(-1)}
.udir svg{width:100%;height:100%;animation:uspin 16s linear infinite}
@keyframes uspin{to{transform:rotate(360deg)}}
.udir.ccw svg{animation-direction:reverse}
.upile{position:relative;width:var(--pw);height:calc(var(--pw) * 1.5);padding:0;border:0;background:none;flex:none;color:var(--ink)}
button.upile{cursor:pointer}
.upile .ucard.big{position:absolute;inset:0}
.udisc .ucard.big{transform:translate(var(--dx,0),var(--dy,0)) rotate(var(--r,0deg));filter:drop-shadow(0 3px 5px rgba(0,0,0,.45))}
.udisc .ucard.old{filter:brightness(.8) drop-shadow(0 3px 5px rgba(0,0,0,.45))}
.udisc .ucard.top{border-radius:8px;box-shadow:0 0 0 4px var(--ring),0 0 24px var(--ring);transition:box-shadow .3s;filter:none}
.uleft{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:12px;color:var(--muted)}
.upend{position:absolute;top:6px;left:50%;transform:translateX(-50%);background:#d8382e;color:#fff;font:900 22px var(--display);padding:2px 14px;border-radius:99px;z-index:2}
.upend[hidden]{display:none}
.ucard svg{width:100%;height:100%;display:block}
.ucard.big{display:block;width:100%;height:100%}
.uact{display:flex;justify-content:center;gap:10px;padding:6px 8px 2px;flex:none;min-height:44px}
.ubtn{border:0;border-radius:12px;padding:10px 18px;font:800 16px var(--display);background:rgba(255,255,255,.14);color:var(--ink);cursor:pointer}
.ubtn.last{background:#d8382e;color:#fff;box-shadow:0 3px 0 #8e1f18}
.ubtn:disabled{opacity:.28;box-shadow:none}
.uhand{position:relative;flex:none;--cw:70px;height:calc(var(--cw) * 1.5 + 24px);margin:0 6px 10px}
.uhand .ucard{position:absolute;bottom:2px;width:var(--cw);height:calc(var(--cw) * 1.5);padding:0;border:0;background:none;transition:transform .15s,filter .15s;filter:drop-shadow(0 2px 3px rgba(0,0,0,.45));cursor:pointer}
.uhand.myturn .ucard:not(.ok){filter:brightness(.55) drop-shadow(0 2px 3px rgba(0,0,0,.45))}
.uhand .ucard.ok{transform:translateY(-16px)}
.ufly{position:fixed;left:0;top:0;z-index:30;pointer-events:none;transform-origin:0 0}
#uno.uflip .ucenter,#uno.uflip .uhand,#uno.uflip .uopps{animation:uflipk .42s ease-in-out}
@keyframes uflipk{50%{transform:rotateY(90deg)}}
.ucolors{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.ucolrow{display:flex;gap:10px;justify-content:center;width:100%;max-width:420px}
.ucolrow button{flex:1;height:52px;border-radius:14px;border:2px solid rgba(255,255,255,.85);background:var(--c);box-shadow:0 3px 0 rgba(0,0,0,.35);cursor:pointer;display:grid;place-items:center;animation:ucolin .18s ease-out}
.ucolrow button:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.ucolrow svg{width:22px;height:22px}
@keyframes ucolin{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
.ucolors button{height:84px;border-radius:16px;border:0;background:var(--c);box-shadow:0 3px 0 rgba(0,0,0,.3);cursor:pointer;display:grid;place-items:center}
.ucolors svg{width:26px;height:26px}
.btns.col{flex-direction:column}
.utab tr.w td{font-weight:800}

/* poker */
.poster.pk{background:radial-gradient(90% 90% at 50% 18%,#77502f,#2c1a0d)}
#poker{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;background:radial-gradient(120% 90% at 50% 35%,#24302c,#0c1210);user-select:none;-webkit-user-select:none;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--pr:1.5}
#poker[hidden]{display:none}
#poker .chip.score small{font-size:12px;color:var(--muted);margin-right:6px}
.ptable{position:relative;flex:1;min-height:0;margin:4px 8px 0}
.pfelt{position:absolute;left:4%;right:4%;top:14%;bottom:6%;border-radius:50%/42%;background:radial-gradient(100% 90% at 50% 40%,#1f7a5c,#0e4633);border:7px solid #4a2c18;box-shadow:inset 0 0 0 2px rgba(255,255,255,.08),0 10px 30px rgba(0,0,0,.5)}
.pboard{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);display:flex;gap:4px;--bw:min(13.5vw,58px)}
.pslot{width:var(--bw);height:calc(var(--bw) * var(--pr));border-radius:6px}
.pslot.empty{border:1.5px dashed rgba(255,255,255,.18)}
.pslot.pnew{animation:pdeal .35s ease-out}
@keyframes pdeal{from{transform:translateY(-14px) rotateY(80deg);opacity:0}to{transform:none;opacity:1}}
.pc{width:100%;height:100%;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
.pc>svg,.pc>.ci{width:100%!important;height:100%!important;display:block}
.ppot{position:absolute;left:50%;top:calc(47% + min(13.5vw,58px) * var(--pr) / 2 + 10px);transform:translateX(-50%);font:800 17px var(--display);color:#fbf3dc;display:flex;align-items:center;gap:6px;white-space:nowrap}
.pchip{display:inline-block;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle,#f2c230 0 35%,#fff 36% 48%,#c8382e 49%);box-shadow:0 1px 2px rgba(0,0,0,.5)}
.pseat{position:absolute;transform:translateX(-50%);width:clamp(72px,22vw,96px);display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;transition:opacity .2s}
.pseat .pcards{display:flex;justify-content:center;height:calc(var(--sw) * var(--pr));--sw:clamp(24px,7vw,32px)}
.pseat .pcards .pc{width:var(--sw);height:calc(var(--sw) * var(--pr));margin-left:calc(var(--sw) * -.45)}
.pseat .pcards.n2 .pc{margin-left:calc(var(--sw) * -.15)}
.pseat.shown .pcards{--sw:clamp(34px,10vw,44px)}
.pseat.shown .pcards.n5{--sw:clamp(28px,8.4vw,36px)}
.pseat .pcards .pc:first-child{margin-left:0}
.pseat .pname{display:flex;align-items:center;gap:4px;max-width:100%;background:rgba(0,0,0,.55);border-radius:10px;padding:3px 8px;font-size:12.5px;border:1.5px solid transparent}
.pseat .pname b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pseat.turn .pname,.pmeseat.turn .pmycards{border-color:var(--brass);box-shadow:0 0 0 2px rgba(214,170,74,.35)}
.pseat .pstack{font:700 12.5px var(--ui,inherit);color:#e8e0cc;font-variant-numeric:tabular-nums}
.plab{font:800 11.5px var(--ui,inherit);background:rgba(255,255,255,.9);color:#1f1a14;border-radius:8px;padding:1px 7px;white-space:nowrap}
.plab.w{background:var(--brass);color:var(--brass-ink)}
.pseat.folded{opacity:.45}.pseat.out{opacity:.25}
.pseat.win .pname{border-color:var(--brass);background:rgba(214,170,74,.3)}
.pdealer{font-style:normal;display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;background:#fbf7ee;color:#1f1a14;font:900 10px var(--ui,inherit);flex:none}
.pme{flex:none;padding:0 8px}
.pmeseat{display:flex;flex-direction:column;align-items:center;gap:6px;transition:opacity .2s}
.pmeseat.folded .pmycards{opacity:.45}
.pmycards{display:flex;justify-content:center;gap:6px;padding:4px;border-radius:12px;border:1.5px solid transparent;--mw:min(22vw,92px)}
.pmycards.n5{--mw:min(17.5vw,74px);gap:4px}
.pmine{width:var(--mw);height:calc(var(--mw) * var(--pr));padding:0;border:0;background:none;transition:transform .15s;cursor:pointer}
.pmine.sel{transform:translateY(-14px);filter:brightness(.75)}
.pmeinfo{display:flex;align-items:center;gap:8px;min-height:24px;font-weight:700}
.pmeinfo .pstack{font:800 17px var(--display);font-variant-numeric:tabular-nums}
.phand{font-size:13px;color:#e8e0cc;background:rgba(255,255,255,.12);border-radius:8px;padding:2px 8px}
.pmeseat.win .pstack{color:var(--brass)}
.pact{position:relative;flex:none;padding:8px 8px 12px;min-height:58px;display:flex;flex-direction:column;gap:8px;align-items:stretch}
.prow{display:flex;gap:8px}
.pbtn{flex:1;border:0;border-radius:12px;padding:13px 6px;font:800 16px var(--display);background:rgba(255,255,255,.14);color:var(--ink);cursor:pointer;white-space:nowrap}
.pbtn.pri{background:var(--brass);color:var(--brass-ink)}
.pbtn.fold{background:rgba(200,60,48,.35)}
.pbtn.wide{width:100%}
.praise{position:absolute;left:8px;right:8px;bottom:calc(100% - 4px);display:flex;flex-direction:column;gap:8px;background:rgba(12,18,16,.94);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:10px;box-shadow:0 -6px 20px rgba(0,0,0,.45);z-index:5}
.pquick{display:flex;gap:6px}
.pquick button{flex:1;border:1px solid rgba(255,255,255,.2);background:none;color:var(--ink);border-radius:10px;padding:8px 2px;font-weight:700;cursor:pointer}
.pslide{display:flex;align-items:center;gap:10px}
.pslide input{flex:1;accent-color:var(--brass)}
.pslide b{min-width:64px;text-align:right;font:800 17px var(--display);font-variant-numeric:tabular-nums}
.pflychip{position:fixed;left:-7px;top:-7px;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle,#f2c230 0 35%,#fff 36% 48%,#c8382e 49%);z-index:40;pointer-events:none}

/* remi */
.poster.pr{background:radial-gradient(90% 90% at 50% 18%,#7c8a2b,#2c330b)}
#home .poster.solo{grid-column:1/-1;justify-self:center;width:calc((100% - 12px) / 2)}
@media (orientation:landscape) and (min-width:600px){#home .poster.solo{grid-column:2;width:auto;justify-self:stretch}}
#remi{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;background:radial-gradient(120% 90% at 50% 35%,#2c3416,#10140a);user-select:none;-webkit-user-select:none;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--rr:1.5}
#remi[hidden]{display:none}
#remi .chip.score small{color:var(--muted);font-size:12px}
.rboard{position:relative;flex:1;min-height:0}
.ropps{position:absolute;inset:0;z-index:2;pointer-events:none}
.ropp{position:absolute;left:clamp(48px,calc(var(--x) * 1%),calc(100% - 48px));top:calc(var(--y) * 1%);transform:translate(-50%,-50%);width:clamp(86px,24vw,150px);box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 4px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.34);min-width:0;font-size:12.5px}
.ropp.turn{border-color:var(--brass);box-shadow:0 0 0 2px rgba(214,171,82,.35)}
.ropp.open .rname b{color:#d9e7a8}
.ropp .rname{max-width:100%;overflow:hidden}.ropp .rname b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.rcount{display:flex;align-items:center;justify-content:center;height:calc(25px * var(--rr));max-width:100%;position:relative}.rcount b{font-size:13px;position:absolute;right:-8px;top:-5px;background:rgba(0,0,0,.72);border-radius:99px;padding:0 5px}
.rback{display:block;width:18px;height:calc(18px * var(--rr));margin-left:-11px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}.rback:first-child{margin-left:0}.rback>*{width:100%!important;height:100%!important}
.ropp small{color:var(--muted);font-variant-numeric:tabular-nums}
.rtable{position:absolute;inset:0;overflow-y:auto;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:8px;padding:82px 10px 24px;--mw:clamp(40px,11.5vw,52px)}
.rmeld{display:flex;padding:3px;border-radius:8px;background:rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.08);cursor:pointer}
.rmeld.mine{border-color:rgba(214,171,82,.45)}
.rmeld .rc{width:var(--mw);height:calc(var(--mw) * var(--rr));margin-left:calc(var(--mw) * -.62)}
.rmeld .rc:first-child{margin-left:0}
.rmeld.new{animation:rnew .5s ease-out}
.rmeld.fl{animation:rfl .6s ease-out}
@keyframes rnew{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
@keyframes rfl{0%{box-shadow:0 0 0 3px var(--brass)}100%{box-shadow:none}}
.rc>*{width:100%!important;height:100%!important;display:block}
.rc{filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.rpiles{display:flex;align-items:center;gap:12px;padding:4px 12px;flex:none;min-height:calc(54px * var(--rr) + 8px)}
.rpile{position:relative;width:54px;height:calc(54px * var(--rr));padding:0;border:0;background:none;cursor:pointer;flex:none;border-radius:6px}
.rpile .rc{width:100%;height:100%}
.rpile .rc.empty{border:1.5px dashed rgba(255,255,255,.2);border-radius:6px;filter:none}
.rpile.go{box-shadow:0 0 0 3px var(--brass);border-radius:6px}
.rleft{position:absolute;bottom:3px;right:3px;background:rgba(0,0,0,.6);color:#fff;border-radius:6px;padding:0 5px;font-size:11px;font-weight:700}
.rstage{flex:1;min-width:0;display:flex;align-items:center;gap:6px;overflow-x:auto;--mw:34px}
.rmeld.st{border-style:dashed;border-color:rgba(255,255,255,.35)}
.rsum{font:800 18px var(--display);color:var(--muted);white-space:nowrap}.rsum small{font-size:12px}.rsum.ok{color:#d9e7a8}
.ract{display:flex;justify-content:center;gap:8px;padding:4px 8px;flex:none;min-height:44px;flex-wrap:wrap}
.ract .ubtn.pri{background:var(--brass);color:var(--brass-ink)}
.ract .ubtn.sort{font-size:14px;padding:10px 12px;letter-spacing:.05em}
.rhand{position:relative;flex:none;margin:0 4px 10px;--cw:56px}
.rhand .rc{position:absolute;width:var(--cw);height:calc(var(--cw) * var(--rr));transition:transform .12s;cursor:pointer}
.rhand .rc.sel{transform:translateY(-14px);filter:drop-shadow(0 0 6px rgba(214,171,82,.9))}
.rhand .rc.must{outline:3px solid #d9e7a8;outline-offset:-1px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>// ===================== ENGINE (pure game logic + AI) =====================
const Engine = (() => {
  const shuffle = (a, rng = Math.random) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

    { k: '6', n: 6, st: 4, p: 0 }, { k: '5', n: 5, st: 3, p: 0 }, { k: '4', n: 4, st: 2, p: 0 }, { k: '2', n: 2, st: 1, p: 0 }];
  function bDeck() { const d = []; for (let s = 0; s < 4; s++) for (const r of B_RANKS) d.push({ id: 'b' + s + r.k, s, r: r.k, n: r.n, st: r.st, p: r.p }); return d; }

  function bNew(opts) {

    const teams = opts.players === 3 ? 3 : (opts.players === 4 && opts.solo) ? 4 : 2; // solo: four players, each for themselves

  }
  function bDeal(st) {

    const deck = shuffle(bDeck().filter(c => c.id !== st.removed), DEAL_RNG);
    const hs = st.opts.double ? 4 : 3;
    st.hands = {}; st.seats.forEach(s => st.hands[s] = []);

  function bBeats(a, b, T) { return a.s === b.s ? a.st > b.st : a.s === T; }

  }
  function bFinishTrick(st) {

    return { winner: w, draws };
  }
  function bHandOver(st) { return st.trick.length === 0 && st.seats.every(s => st.hands[s].length === 0); }
  function bPoints(st) { return st.won.map(cs => sum(cs, c => c.p)); }

  function bAI(st, seat) {
    const hand = st.hands[seat], T = st.trump, order = bOrder(st), pos = st.trick.length;

  }

  // ================================= BELA =================================
  // Mađarice (German-suited, William Tell). Suits: 0 Herc, 1 Bundeva(zvono), 2 Zeleni(list), 3 Žir
  const H_KEYS = ['7', '8', '9', '10', 'U', 'O', 'K', 'A'];
  const T_STR = { '7': 1, '8': 2, 'O': 3, 'K': 4, '10': 5, 'A': 6, '9': 7, 'U': 8 };
  const N_STR = { '7': 1, '8': 2, '9': 3, 'U': 4, 'O': 5, 'K': 6, '10': 7, 'A': 8 };
  const T_PTS = { 'U': 20, '9': 14, 'A': 11, '10': 10, 'K': 4, 'O': 3 };
  const N_PTS = { 'A': 11, '10': 10, 'K': 4, 'O': 3, 'U': 2 };
  function hDeck() { const d = []; for (let s = 0; s < 4; s++) H_KEYS.forEach((k, q) => d.push({ id: 'h' + s + k, s, r: k, q })); return d; }
  const H_ALL = hDeck();   // read-only copy for card counting
  const hStr = (c, T) => c.s === T ? 100 + T_STR[c.r] : N_STR[c.r];
  const hPts = (c, T) => (c.s === T ? T_PTS : N_PTS)[c.r] || 0;

  function hNew(opts) { return { game: 'h', opts, seats: [0, 1, 2, 3], dealer: 3, score: [0, 0], hang: 0, rows: [] }; }
  function hDeal(st) {
    const deck = shuffle(hDeck(), DEAL_RNG);
    st.hands = {}; st.talon = {};
    for (const s of st.seats) { st.hands[s] = deck.splice(0, 6); st.talon[s] = deck.splice(0, 2); }
    st.trump = null; st.caller = null; st.bidder = nextSeat(st, st.dealer); st.bids = [];
    st.trick = []; st.won = [[], []]; st.tricks = [0, 0]; st.seen = new Set(); st.lastTrick = null; st.trickNo = 0;
    st.void = { 0: {}, 1: {}, 2: {}, 3: {} }; st.belaSeat = null; st.belaCalled = false; st.belaSkipped = false; st.decls = null;
  }
  function hBidValue(hand, s) {
    let v = 0; const tr = hand.filter(c => c.s === s);
    const tv = { 'U': 16, '9': 12, 'A': 8, '10': 6, 'K': 4, 'O': 4, '8': 3, '7': 3 };
    for (const c of tr) v += tv[c.r];
    for (const c of hand) if (c.s !== s) {
      if (c.r === 'A') v += 7;
      else if (c.r === '10') v += hand.some(x => x.s === c.s && x.r === 'A') ? 4 : 1.5;
      else if (c.r === 'K') v += 1;
    }
    if (tr.length >= 3) v += 4;
    if (tr.some(c => c.r === 'U') && tr.some(c => c.r === '9')) v += 4;
    if (tr.some(c => c.r === 'K') && tr.some(c => c.r === 'O')) v += 4;
    return v;
  }
  // returns suit index, or -1 to pass
  function hAIBid(st, seat, thr = 38) {
    const hand = st.hands[seat]; let best = 0, bv = -1;
    for (let s = 0; s < 4; s++) { const v = hBidValue(hand, s); if (v > bv) { bv = v; best = s; } }
    const forced = seat === st.dealer;
    return (forced || bv >= thr) ? best : -1;
  }
  function hBid(st, seat, suit) {
    st.bids.push({ seat, suit });
    if (suit >= 0) {
      st.trump = suit; st.caller = seat;
      for (const s of st.seats) st.hands[s].push(...st.talon[s]);
      st.leader = nextSeat(st, st.dealer);
      for (const s of st.seats) {
        const h = st.hands[s];
        if (h.some(c => c.s === suit && c.r === 'K') && h.some(c => c.s === suit && c.r === 'O')) st.belaSeat = s;

      return true;
    }
    st.bidder = nextSeat(st, seat);
    return false;
  }
  function hFindDecls(hand) {
    const out = [];
    for (let s = 0; s < 4; s++) {
      const qs = hand.filter(c => c.s === s).map(c => c.q).sort((a, b) => a - b);
      let i = 0;
      while (i < qs.length) {
        let j = i; while (j + 1 < qs.length && qs[j + 1] === qs[j] + 1) j++;
        const L = j - i + 1;
        if (L >= 3) out.push({ type: L === 8 ? 'belot' : 'seq', s, len: L, top: qs[j], low: qs[i], val: L === 8 ? 1001 : L === 3 ? 20 : L === 4 ? 50 : 100 });
        i = j + 1;
      }
    }
    for (const r of ['U', '9', 'A', '10', 'K', 'O']) {
      if (hand.filter(c => c.r === r).length === 4) out.push({ type: 'quad', r, val: r === 'U' ? 200 : r === '9' ? 150 : 100, len: 4, top: H_KEYS.indexOf(r) });
    }

  }
  const declKey = d => [d.type === 'belot' ? 1 : 0, d.val, d.type === 'quad' ? 1 : 0, d.len, d.top];
  function cmpKey(a, b) { for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return a[i] - b[i]; return 0; }
  function hResolveDecls(st) {

      per[s] = hFindDecls(st.hands[s]);
      for (const d of per[s]) { const k = declKey(d); if (!bestKey || cmpKey(k, bestKey) > 0) { bestKey = k; bestSeat = s; } }
    }
    const team = bestSeat === null ? -1 : bestSeat % 2;
    const belot = order.find(s => per[s].some(d => d.type === 'belot'));
    let total = 0;
    if (team >= 0) for (const s of order) if (s % 2 === team) total += sum(per[s].filter(d => d.type !== 'belot'), d => d.val);
    return { per, order, team, total, belotSeat: belot === undefined ? null : belot };
  }
  function hTrickMaxStr(trick, T, suitFilter) { let m = 0; for (const t of trick) if (suitFilter(t.card)) m = Math.max(m, hStr(t.card, T)); return m; }
  function hLegal(st, seat) {
    const hand = st.hands[seat], T = st.trump, trick = st.trick;
    if (!trick.length) return hand.slice();

    const follow = hand.filter(c => c.s === led);
    if (follow.length) {
      if (led !== T && trick.some(t => t.card.s === T)) return follow;
      const mx = hTrickMaxStr(trick, T, c => c.s === led);
      const higher = follow.filter(c => hStr(c, T) > mx);
      return higher.length ? higher : follow;
    }
    const trumps = hand.filter(c => c.s === T);
    if (trumps.length) {
      const mx = hTrickMaxStr(trick, T, c => c.s === T);
      const higher = trumps.filter(c => hStr(c, T) > mx);
      return higher.length ? higher : trumps;
    }
    return hand.slice();
  }
  function hWinnerIdx(trick, T) {
    let w = 0;
    for (let i = 1; i < trick.length; i++) {
      const a = trick[i].card, b = trick[w].card;
      if ((a.s === b.s && hStr(a, T) > hStr(b, T)) || (a.s === T && b.s !== T)) w = i;
    }
    return w;
  }
  function hToPlay(st) { return roundFrom(st, st.leader)[st.trick.length]; }
  // returns {done, bela}
  // bela is optional: the holder may stay quiet (e.g. when the callers are going to fall anyway)
  function hBelaEligible(st, seat, card) {
    return seat === st.belaSeat && !st.belaCalled && !st.belaSkipped && card.s === st.trump && (card.r === 'K' || card.r === 'O');
  }
  function hAIBela(st, seat) {
    const me = seat % 2;
    if (me !== st.caller % 2) return true;                // defenders always gain from bela
    const D = st.decls, zOpp = D.team === 1 - me ? D.total : 0, zOur = D.team === me ? D.total : 0;
    if (zOpp < 120) return true;                           // e.g. 150+, or four aces with another 20/40
    const won = sum(st.won[me], c => hPts(c, st.trump));
    return won + zOur + 20 > (162 + zOpp + zOur + 20) / 2; // only call if passing is already certain
  }
  function hPlay(st, seat, card, callBela = true) {
    const T = st.trump, h = st.hands[seat];
    if (st.trick.length) {
      const led = st.trick[0].card.s;
      if (card.s !== led) { st.void[seat][led] = true; if (card.s !== T) st.void[seat][T] = true; }
    }
    let bela = false;
    if (hBelaEligible(st, seat, card)) { if (callBela) { st.belaCalled = true; bela = true; } else st.belaSkipped = true; }
    h.splice(h.findIndex(c => c.id === card.id), 1);
    st.trick.push({ seat, card }); st.seen.add(card.id);
    return { done: st.trick.length === 4, bela };
  }
  function hFinishTrick(st) {
    const w = st.trick[hWinnerIdx(st.trick, st.trump)].seat;
    const tm = w % 2;
    st.won[tm].push(...st.trick.map(t => t.card)); st.tricks[tm]++;
    st.lastTrick = { trick: st.trick, winner: w, pts: sum(st.trick, t => hPts(t.card, st.trump)) };
    st.trick = []; st.leader = w; st.trickNo++;
    if (st.trickNo === 8) st.lastWinner = w;
    return { winner: w };
  }
  function hHandOver(st) { return st.trickNo === 8; }
  function hScoreHand(st) {
    const T = st.trump, c = st.caller % 2, o = 1 - c;
    const cardPts = st.won.map(cs => sum(cs, x => hPts(x, T)));
    const pts = cardPts.slice(); pts[st.lastWinner % 2] += 10;
    const declPts = [0, 0];
    if (st.decls.team >= 0 && st.tricks[st.decls.team] > 0) declPts[st.decls.team] += st.decls.total;
    const belaTeam = st.belaSeat === null ? -1 : st.belaSeat % 2;
    if (belaTeam >= 0 && st.belaCalled && st.tricks[belaTeam] > 0) declPts[belaTeam] += 20;
    let stiglja = -1;
    for (const t of [0, 1]) if (st.tricks[t] === 8) { pts[t] += 90; stiglja = t; }
    const tot = [pts[0] + declPts[0], pts[1] + declPts[1]];
    const all = tot[0] + tot[1];
    let result, add = [0, 0], hangUse = st.hang;
    if (tot[c] > tot[o]) { result = 'pass'; add = tot.slice(); add[c] += st.hang; st.hang = 0; }

  }
  function hMatchWinner(st) {
    const t = st.opts.target;
    if (st.score[0] >= t || st.score[1] >= t) { if (st.score[0] !== st.score[1]) return st.score[0] > st.score[1] ? 0 : 1; }

  function hAI(st, seat) {
    const legal = hLegal(st, seat);

    const T = st.trump, hand = st.hands[seat], pos = st.trick.length;
    const order = roundFrom(st, st.leader), after = order.slice(pos + 1), me = seat % 2;

    const pHold = card => opps.reduce((p, o) => p * holdVs(card, o), 1);
    const isMaster = c => !unk.some(x => x.s === c.s && hStr(x, T) > hStr(c, T)) && (c.s === T || true);

    const callerTeam = st.caller % 2 === me;
    // card counting: can either opponent still hold a trump?
    const oppSeats = st.seats.filter(s => s % 2 !== me);
    const oppsMayTrump = unkT.length > 0 && oppSeats.some(o => !st.void[o][T]);
    const jackOut = st.seen.has('h' + T + 'U');
    const iHaveJack = hand.some(x => x.s === T && x.r === 'U');

    const naMus = st.caller === st.dealer && st.bids.filter(b => b.suit < 0).length === 3;
    const partnerCalled = st.caller !== seat && st.caller % 2 === me;
    const pullForJack = partnerCalled && !naMus && !jackOut && !iHaveJack && oppsMayTrump;
    // with no trumps left against us, keep leading trumps only if every card we hold is a winner
    const allMasters = hand.every(x => !unk.some(y => (y.s === x.s && hStr(y, T) > hStr(x, T)) || (x.s !== T && y.s === T && oppsMayTrump)));
    // pulling for the caller's jack: king or ober first (the next opponent has to beat it, often with the ace or 10,

<script>// ===================== AI TIERS (Novice, Average, Pro, Cardshark) =====================

    <path d="M-30,-22H30" stroke="${R}" stroke-width="6"/><path d="M-30,-22H30" stroke="${K}" stroke-width="1" transform="translate(0,-3.5)"/>
    <path d="M-16,-4V3M-6,-6V6M6,-6V6M16,-4V3" stroke="${B}" stroke-width="4" stroke-linecap="round"/>
    <rect x="-38" y="-48" width="76" height="9" rx="3" fill="${R}" ${sw} stroke-width="3"/>`;
  const swordArt = `<path d="M-6,30L-6,-36L0,-50L6,-36L6,30Z" fill="${S}" ${sw} stroke-width="3"/>
    <path d="M0,-42V28" stroke="${B}" stroke-width="2"/>
    <path d="M-26,28Q0,20 26,28L26,36Q0,28 -26,36Z" fill="${Y}" ${sw} stroke-width="3"/>
    <rect x="-4.5" y="35" width="9" height="12" fill="${R}" ${sw} stroke-width="2.5"/>
    <circle cy="51" r="5.5" fill="${Y}" ${sw} stroke-width="2.5"/>`;
  const batonArt = `<path d="M-5,46L-9,-38Q0,-52 9,-38L5,46Q0,50 -5,46Z" fill="${Y}" ${sw} stroke-width="3.5"/>
    <path d="M-8,-30L-14,-36M8,-16L14,-22M-7,0L-13,-6M7,16L13,10M-6,30L-11,25" stroke="${K}" stroke-width="5" stroke-linecap="round"/>
    <path d="M-8,-30L-14,-36M8,-16L14,-22M-7,0L-13,-6M7,16L13,10M-6,30L-11,25" stroke="${Y}" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M-8,-22H8M-7,38H7" stroke="${R}" stroke-width="4"/>
    <ellipse cy="-41" rx="6" ry="4" fill="${B}" ${sw} stroke-width="2"/>`;
  const SUIT = [cupArt, coinArt, swordArt, batonArt];
  const g = (art, x, y, sc, rot = 0) => `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${sc})">${art}</g>`;

  // ---- curved sword along a quadratic path (for interlaced pips) ----
  function curvedSword(x1, y1, cx, cy, x2, y2) {
    // hilt at (x1,y1), tip at (x2,y2)
    const d = `M${x1},${y1}Q${cx},${cy} ${x2},${y2}`;
    const ang = Math.atan2(cy - y1, cx - x1) * 180 / Math.PI + 90;
    return `<path d="${d}" fill="none" stroke="${K}" stroke-width="7" stroke-linecap="round"/>
      <path d="${d}" fill="none" stroke="${S}" stroke-width="4.4" stroke-linecap="round"/>
      <path d="${d}" fill="none" stroke="${B}" stroke-width="1" />
      <g transform="translate(${x1} ${y1}) rotate(${ang})"><rect x="-10" y="-2.5" width="20" height="5" rx="2" fill="${Y}" ${sw} stroke-width="1.6"/><rect x="-2.5" y="2.5" width="5" height="7" fill="${R}" ${sw} stroke-width="1.4"/><circle cy="12" r="3" fill="${Y}" ${sw} stroke-width="1.4"/></g>`;
  }
  function swordPips(n) {
    const cx = W / 2, top = 30, bot = 162, mid = (top + bot) / 2;
    const pairs = Math.floor(n / 2), widths = { 1: [22], 2: [30, 15], 3: [33, 22, 11] }[pairs] || [];
    let out = '';
    widths.forEach((w, i) => {
      const inset = i * 4;
      out += curvedSword(cx - 4, bot - inset, cx - w * 2, mid, cx + 3, top + inset);
      out += curvedSword(cx + 4, top + inset, cx + w * 2, mid, cx - 3, bot - inset);
    });
    if (n % 2) out += g(swordArt, cx, mid, n === 1 ? 1 : 0.62);
    return out;
  }
  function batonPips(n) {
    const cx = W / 2, cy = 96, k = Math.floor(n / 2);
    const offs = { 1: [0], 2: [-11, 11], 3: [-15, 0, 15] }[k] || [];
    let out = '';
    const one = (x, rot) => `<g transform="translate(${x} ${cy}) rotate(${rot}) scale(.36 1.42)"><path d="M-6,46L-10,-40Q0,-52 10,-40L6,46Q0,50 -6,46Z" fill="${Y}" ${sw} stroke-width="3.2"/><path d="M-9,-24H9M-8,8H8M-7,34H7" stroke="${R}" stroke-width="3.5"/><ellipse cy="-42" rx="7" ry="3" fill="${B}" ${sw} stroke-width="2"/></g>`;
    offs.forEach(o => { out += one(cx + o, -17); });
    offs.forEach(o => { out += one(cx + o, 17); });
    if (n % 2) out += one(cx, 0);
    return out;
  }
  const P2 = {
    2: [[52, 56], [52, 136]], 3: [[52, 44], [52, 96], [52, 148]],
    4: [[32, 56], [72, 56], [32, 136], [72, 136]], 5: [[32, 52], [72, 52], [52, 96], [32, 140], [72, 140]],
    6: [[32, 46], [72, 46], [32, 96], [72, 96], [32, 146], [72, 146]],
    7: [[32, 42], [72, 42], [52, 70], [32, 98], [72, 98], [32, 150], [72, 150]]
  };
  function sprig(x, y, rot) { return `<g transform="translate(${x} ${y}) rotate(${rot})"><path d="M0,0C4,-6 10,-8 14,-6C10,-3 6,-1 0,0Z" fill="${B}" ${sw} stroke-width=".8"/><path d="M0,0C-4,-6 -10,-8 -14,-6C-10,-3 -6,-1 0,0Z" fill="${R}" ${sw} stroke-width=".8"/></g>`; }

  // ---- court figures: top half (y 8..88), mirrored for the bottom ----
  const COURT_COL = [[R, B], [B, R], [R, Y], [B, Y]]; // [main, secondary] per suit
  function face(cx, cy, beard) {
    return `<path d="M${cx - 11},${cy - 4}Q${cx - 13},${cy + 10} ${cx - 8},${cy + 16}L${cx + 8},${cy + 16}Q${cx + 13},${cy + 10} ${cx + 11},${cy - 4}Z" fill="#7a4a24" ${sw} stroke-width="1.2"/>
      <ellipse cx="${cx}" cy="${cy}" rx="9.5" ry="11.5" fill="${SKIN}" ${sw} stroke-width="1.6"/>
      <path d="M${cx - 5},${cy - 2}h3.5M${cx + 1.5},${cy - 2}h3.5" stroke="${K}" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M${cx},${cy - 1}l-1.6,5h2.6" fill="none" stroke="${K}" stroke-width="1"/>
      <path d="M${cx - 3},${cy + 7}q3,1.6 6,0" fill="none" stroke="${R}" stroke-width="1.3" stroke-linecap="round"/>
      ${beard ? `<path d="M${cx - 9},${cy + 3}Q${cx - 8},${cy + 18} ${cx},${cy + 20}Q${cx + 8},${cy + 18} ${cx + 9},${cy + 3}Q${cx + 5},${cy + 10} ${cx},${cy + 10}Q${cx - 5},${cy + 10} ${cx - 9},${cy + 3}Z" fill="#8c6a4a" ${sw} stroke-width="1.2"/>` : ''}`;
  }
  function courtTop(c) {
    const [m, s2] = COURT_COL[c.s], sym = SUIT[c.s];
    const holdSc = c.s === 2 || c.s === 3 ? 0.3 : 0.2;
    if (c.r === 'K') return `
      <path d="M8,88L14,58Q26,48 42,50L52,62L62,50Q78,48 90,58L96,88Z" fill="${m}" ${sw} stroke-width="1.8"/>
      <path d="M36,88L40,58L52,64L64,58L68,88Z" fill="${s2}" ${sw} stroke-width="1.6"/>
      <path d="M40,70H64M39,79H65" stroke="${Y}" stroke-width="2.4"/>
      <path d="M28,56Q52,70 76,56L74,50Q52,62 30,50Z" fill="#fff" ${sw} stroke-width="1.4"/>
      ${[34, 44, 52, 60, 70].map(x => `<circle cx="${x}" cy="${57 + (x === 52 ? 4 : x === 44 || x === 60 ? 2.5 : 0)}" r="1" fill="${K}"/>`).join('')}
      <path d="M22,88L28,44" stroke="${K}" stroke-width="4.4" stroke-linecap="round"/><path d="M22,88L28,44" stroke="${Y}" stroke-width="2.4" stroke-linecap="round"/><circle cx="28.5" cy="41" r="4" fill="${Y}" ${sw} stroke-width="1.4"/>
      ${face(52, 34, true)}
      <path d="M40,26L37,10L45,18L52,6L59,18L67,10L64,26Z" fill="${Y}" ${sw} stroke-width="1.6"/>
      <rect x="39" y="22" width="26" height="6" fill="${R}" ${sw} stroke-width="1.4"/>
      <circle cx="52" cy="13" r="1.8" fill="${B}"/><circle cx="45" cy="25" r="1.4" fill="${Y}"/><circle cx="59" cy="25" r="1.4" fill="${Y}"/>
      <ellipse cx="78" cy="70" rx="5" ry="4" fill="${SKIN}" ${sw} stroke-width="1.2"/>
      ${g(sym, 80, 60, holdSc)}`;
    if (c.r === 'F') return `
      <path d="M14,88L20,58Q36,48 52,50Q68,48 84,58L90,88Z" fill="${m}" ${sw} stroke-width="1.8"/>
      <path d="M30,88V56M44,88V51M60,88V51M74,88V56" stroke="${s2}" stroke-width="5"/>
      <path d="M30,88V56M44,88V51M60,88V51M74,88V56" stroke="${K}" stroke-width=".8" transform="translate(2.5 0)"/>
      <path d="M36,52Q52,62 68,52L66,48Q52,56 38,48Z" fill="#fff" ${sw} stroke-width="1.3"/>
      ${face(52, 36, false)}
      <path d="M38,30Q38,14 54,14Q70,15 70,28Q60,22 50,23Q42,24 38,30Z" fill="${s2}" ${sw} stroke-width="1.6"/>
      <path d="M66,20C76,10 84,12 88,6C86,16 78,22 68,24Z" fill="${Y}" ${sw} stroke-width="1.2"/>
      <ellipse cx="24" cy="74" rx="5" ry="4" fill="${SKIN}" ${sw} stroke-width="1.2"/>
      ${g(sym, 22, 62, holdSc)}`;
    // Cavallo: horse head and neck on the left, rider on the right
    return `
      <path d="M6,88C8,66 12,52 24,46C26,38 30,32 36,34L40,44C36,48 33,54 35,62C37,72 40,80 41,88Z" fill="#f4ecd8" ${sw} stroke-width="1.8"/>
      <path d="M24,46C20,40 14,38 10,40C8,46 10,52 16,54C20,54 23,51 24,46Z" fill="#f4ecd8" ${sw} stroke-width="1.6"/>
      <circle cx="15" cy="45" r="1.6" fill="${K}"/>
      <path d="M36,34C42,40 44,50 42,60C44,68 44,78 46,88" fill="none" stroke="${R}" stroke-width="5"/>
      <path d="M12,49L24,48L32,40" fill="none" stroke="${B}" stroke-width="2"/>
      <path d="M44,88L48,60Q64,50 82,58L90,88Z" fill="${m}" ${sw} stroke-width="1.8"/>
      <path d="M50,72H86" stroke="${s2}" stroke-width="5"/>
      ${face(66, 36, false)}
      <path d="M54,30Q54,16 66,15Q79,15 80,30Z" fill="${s2}" ${sw} stroke-width="1.6"/>
      <path d="M72,16C80,6 90,8 94,4C92,14 84,18 76,20Z" fill="${R}" ${sw} stroke-width="1.2"/>
      <ellipse cx="88" cy="70" rx="4.5" ry="3.6" fill="${SKIN}" ${sw} stroke-width="1.2"/>
      ${g(sym, 88, 60, holdSc * 0.9)}`;
  }

  const IT_SUIT = ['COPPE', 'DANARI', 'SPADE', 'BASTONI'];
  const IT_COURT = { F: 'FANTE', C: 'CAVAL.', K: 'RE' };
  const idx = n => `<text x="8" y="17" class="ix" fill="${K}">${n}</text><text x="8" y="17" class="ix" fill="${K}" transform="rotate(180 ${W / 2} ${H / 2})">${n}</text>`;
  function ribbon(y, text, size = 6.4) {
    return `<path d="M10,${y - 7}H94L90,${y}L94,${y + 7}H10L14,${y}Z" fill="${P}" ${sw} stroke-width="1.2"/>
      <text x="${W / 2}" y="${y + 2.3}" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="${size}" letter-spacing=".3" fill="${K}">${text}</text>`;
  }

  function card(c) {
    let b = `<rect x="1" y="1" width="${W - 2}" height="${H - 2}" rx="7" fill="${P}" stroke="#9a9384" stroke-width="1.5"/>`;
    if (['F', 'C', 'K'].includes(c.r)) {
      const top = courtTop(c);
      b += `<rect x="5" y="5" width="${W - 10}" height="${H - 10}" rx="3" fill="none" stroke="${K}" stroke-width="1.4"/>`;
      b += `<g>${top}</g><g transform="rotate(180 ${W / 2} ${H / 2})">${top}</g>`;
      b += `<rect x="5" y="87" width="${W - 10}" height="18" fill="${P}" stroke="${K}" stroke-width="1.4"/>`;
      b += `<text x="${W / 2}" y="98.6" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="7.6" letter-spacing=".4" fill="${K}">${IT_COURT[c.r]} DI ${IT_SUIT[c.s]}</text>`;
      b += `<rect x="5" y="5" width="16" height="16" fill="${P}" stroke="${K}" stroke-width="1"/><rect x="${W - 21}" y="${H - 21}" width="16" height="16" fill="${P}" stroke="${K}" stroke-width="1"/>`;
      b += `<text x="13" y="17" text-anchor="middle" class="ix" fill="${K}">${c.n}</text><text x="13" y="17" text-anchor="middle" class="ix" fill="${K}" transform="rotate(180 ${W / 2} ${H / 2})">${c.n}</text>`;
    } else if (c.n === 1) {
      if (c.s === 1) {
        b += [30, 90, 150, 210, 270, 330].map(a => `<g transform="rotate(${a} 52 86)"><path d="M52,50C58,42 66,42 70,47C65,49 60,52 52,50Z" fill="${GRN}" ${sw} stroke-width="1.1"/></g>`).join('');
        b += g(coinArt, 52, 86, 0.66);
        b += ribbon(160, 'ASSO DI DANARI');
      } else if (c.s === 0) {
        b += g(cupArt, 52, 82, 0.86);
        b += sprig(30, 140, 0) + sprig(74, 140, 0);
        b += ribbon(160, 'ASSO DI COPPE');
      } else if (c.s === 2) {
        b += g(swordArt, 52, 88, 1.18);
        b += `<path d="M30,60C44,52 60,70 74,60" fill="none" stroke="${R}" stroke-width="3"/>`;
        b += ribbon(166, 'ASSO DI SPADE');
      } else {
        b += g(batonArt, 52, 80, 1.08);
        b += `<path d="M10,146H94L90,154L94,162H10L14,154Z" fill="${P}" ${sw} stroke-width="1.2"/>`;
        b += `<text x="52" y="152.6" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="5.6" fill="${K}">AVERE UN BEL BASTON</text>`;
        b += `<text x="52" y="159.6" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="5.6" fill="${K}">IN MANE SEMPRE BON</text>`;
      }
      b += idx(1);
    } else {
      if (c.s === 2) b += swordPips(c.n);
      else if (c.s === 3) b += batonPips(c.n);
      else {
        const art = c.s === 1 ? coinArt : cupArt;
        const sc = c.n <= 3 ? 0.3 : 0.24;
        P2[c.n].forEach(([x, y]) => { b += g(art, x, y, sc); });
        if (c.s === 1 && c.n >= 4) b += sprig(52, 96, 0);
        if (c.s === 1 && c.n === 4) b += `<path d="M44,90L46,84L49,88L52,82L55,88L58,84L60,90Z" fill="${Y}" ${sw} stroke-width="1"/>`;
      }
      b += idx(c.n);
    }
    return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${b}</svg>`;
  }
  const back = () => `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
    <rect x="1" y="1" width="${W - 2}" height="${H - 2}" rx="7" fill="${P}" stroke="#9a9384" stroke-width="1.5"/>
    <rect x="6" y="6" width="${W - 12}" height="${H - 12}" rx="3" fill="url(#bkT)" stroke="#16244a" stroke-width="1.5"/>
    <rect x="${W / 2 - 18}" y="${H / 2 - 18}" width="36" height="36" transform="rotate(45 ${W / 2} ${H / 2})" fill="#1b2e5c" stroke="${P}" stroke-width="1.5"/>
    <circle cx="${W / 2}" cy="${H / 2}" r="7" fill="${P}"/></svg>`;
  const PATTERN = `<pattern id="bkT" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#1b2e5c"/><path d="M5,0L10,5L5,10L0,5Z" fill="none" stroke="#4d6fae" stroke-width=".9"/><circle cx="5" cy="5" r="1" fill="#8aa4d6"/></pattern>`;
  return { card, back, SUIT, PATTERN, W, H };
})();
</script>
<script>// ===================== MAĐARICE (William Tell pattern, redrawn) =====================
// 59 x 91 mm cards, double-headed, Roman numerals in both top corners (repeated upside down),
// two-tone suit signs, landscape vignettes on VII/VIII/X, king on horseback, seasons on the aces.
const Madjarice = (() => {
  const W = 118, H = 182, CX = 59;
  const K = '#1a1a1a', R = '#d8262b', Y = '#f4c51f', G = '#3f9a3a', BL = '#2a5aa8', BR = '#8a5a2b', P = '#fffdf6', SKIN = '#f6d7b8';
  const sw = 'stroke="#1a1a1a" stroke-linejoin="round"';

  const heart = `<path d="M0,42C-56,4 -44,-50 0,-22C44,-50 56,4 0,42Z" fill="${R}"/>
    <path d="M-4,-19C-18,-36 -38,-27 -36,-8C-34,4 -24,15 -11,24C-19,9 -19,-6 -4,-19Z" fill="${Y}"/>
    <path d="M0,42C-56,4 -44,-50 0,-22C44,-50 56,4 0,42Z" fill="none" ${sw} stroke-width="3.5"/>`;
  const bell = `<circle cy="-41" r="6" fill="none" ${sw} stroke-width="3.5"/>
    <path d="M-30,20C-32,-8 -22,-35 0,-35C22,-35 32,-8 30,20Z" fill="${Y}" ${sw} stroke-width="3.5"/>
    <path d="M-31.5,-1H31.5V9H-31.5Z" fill="${R}" ${sw} stroke-width="2"/>
    <path d="M-31,9H31L30,20H-30Z" fill="${G}" ${sw} stroke-width="2"/>
    <path d="M-12,-26C-4,-30 6,-30 12,-26" fill="none" stroke="#fff3b8" stroke-width="3" stroke-linecap="round"/>
    <path d="M0,-35V-1" stroke="${K}" stroke-width="2"/>
    <circle cy="28" r="7" fill="${Y}" ${sw} stroke-width="3"/>`;
  const leaf = `<path d="M0,-46C-34,-30 -40,10 -4,38L0,40Z" fill="${Y}"/>
    <path d="M0,-46C34,-30 40,10 4,38L0,40Z" fill="${G}"/>
    <path d="M0,-46C34,-30 40,10 4,38L2,48H-2L-4,38C-40,10 -34,-30 0,-46Z" fill="none" ${sw} stroke-width="3.5"/>
    <path d="M0,-40V40" stroke="${R}" stroke-width="3"/>
    <path d="M0,-18L-16,-28M0,-18L16,-28M0,2L-22,-10M0,2L22,-10M0,20L-16,10M0,20L16,10" stroke="${K}" stroke-width="1.6"/>`;
  const acorn = `<rect x="-3" y="-47" width="6" height="12" fill="${BR}" ${sw} stroke-width="2"/>
    <path d="M0,-8C-27,-8 -25,40 0,42Z" fill="${Y}"/><path d="M0,-8C27,-8 25,40 0,42Z" fill="${R}"/>
    <path d="M0,-8C-27,-8 -25,40 0,42C25,40 27,-8 0,-8Z" fill="none" ${sw} stroke-width="3.5"/>
    <path d="M-27,-6Q-27,-36 0,-37Q27,-36 27,-6Q0,4 -27,-6Z" fill="#7d8f2c" ${sw} stroke-width="3.5"/>
    <path d="M-18,-26L14,-4M-6,-33L22,-14M-22,-14L4,4M18,-30L-14,-2M6,-34L-22,-12M24,-18L0,4" stroke="#4d5a18" stroke-width="2"/>`;
  const SUIT = [heart, bell, leaf, acorn];
  const g = (art, x, y, sc, rot = 0) => `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${sc})">${art}</g>`;

  // small landscape vignette, drawn fully inside its rect
  function scene(x, y, w, h, kind = 'spring') {
    const sky = { spring: '#cfe6f5', summer: '#bfe0f7', autumn: '#f3dcb0', winter: '#dfe5ea' }[kind];
    const ground = { spring: '#7cc06a', summer: '#e9c84a', autumn: '#b88a3c', winter: '#ffffff' }[kind];
    const tree = { spring: '#f2a7b8', summer: '#3f9a3a', autumn: '#e0782c', winter: 'none' }[kind];
    const r = Math.min(8, h / 4);
    const x2 = x + w, y2 = y + h, hz = y + h * 0.58;
    return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${sky}" ${sw} stroke-width="1.2"/>
      <path d="M${x + 1},${hz}Q${x + w * 0.3},${hz - h * 0.18} ${x + w * 0.55},${hz}T${x2 - 1},${hz - h * 0.06}V${y2 - r}Q${x2 - 1},${y2 - 1} ${x2 - r},${y2 - 1}H${x + r}Q${x + 1},${y2 - 1} ${x + 1},${y2 - r}Z" fill="${ground}" stroke="${K}" stroke-width=".8"/>
      <rect x="${x + w * 0.62}" y="${hz - h * 0.2}" width="${w * 0.14}" height="${h * 0.16}" fill="#fff6e0" stroke="${K}" stroke-width=".8"/>
      <path d="M${x + w * 0.6},${hz - h * 0.2}L${x + w * 0.69},${hz - h * 0.34}L${x + w * 0.78},${hz - h * 0.2}Z" fill="${R}" stroke="${K}" stroke-width=".8"/>
      <rect x="${x + w * 0.24}" y="${hz - h * 0.24}" width="${w * 0.03}" height="${h * 0.26}" fill="${BR}"/>
      ${tree === 'none' ? `<path d="M${x + w * 0.255},${hz - h * 0.2}l-${w * 0.06},-${h * 0.14}M${x + w * 0.255},${hz - h * 0.14}l${w * 0.07},-${h * 0.12}" stroke="${BR}" stroke-width="1.2"/>` : `<circle cx="${x + w * 0.255}" cy="${hz - h * 0.3}" r="${Math.min(w, h) * 0.16}" fill="${tree}" stroke="${K}" stroke-width=".8"/>`}
      ${kind === 'summer' ? `<circle cx="${x + w * 0.85}" cy="${y + h * 0.22}" r="${h * 0.1}" fill="${Y}" stroke="${K}" stroke-width=".8"/>` : ''}`;
  }

  // ---- pips ----
  const COLS = [35, 83];
  function layout(n) {
    const sideY = [28, 54, 128, 154];
    const pts = [];
    if (n >= 8) COLS.forEach(x => sideY.forEach(y => pts.push([x, y])));
    if (n === 10) pts.push([CX, 41], [CX, 141]);
    if (n === 9) pts.push([CX, 91]);
    if (n === 7) { COLS.forEach(x => [28, 54].forEach(y => pts.push([x, y]))); pts.push([35, 154], [83, 154], [CX, 134]); }
    return pts;
  }
  function pips(c) {
    const n = +c.r, art = SUIT[c.s], pts = layout(n);
    let out = '';
    if (n === 8 || n === 7) out += scene(14, 74, 90, 34, ['spring', 'summer', 'autumn', 'winter'][c.s]);
    if (n === 10) out += scene(38, 78, 42, 26, ['spring', 'summer', 'autumn', 'winter'][c.s]);
    if (c.s >= 2) {
      // leaves and acorns grow on a red vine
      const segs = pts.map(([x, y]) => `M${CX},${y < 91 ? y + 8 : y - 8}L${x},${y}`).join('');
      out += `<path d="M${CX},20V${n === 8 || n === 7 ? 72 : 162}${n === 8 || n === 7 ? `M${CX},110V162` : ''}${segs}" stroke="${R}" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
    }
    pts.forEach(([x, y]) => { out += g(art, x, y, 0.23, y > 91 ? 180 : 0); });
    return out;
  }

  // ---- court figures (top half, y 6..91, mirrored) ----
  const COURT_COL = [[R, G], [G, R], [BL, Y], [BR, R]];
  function face(cx, cy, beard) {
    return `<ellipse cx="${cx}" cy="${cy}" rx="9.5" ry="11.5" fill="${SKIN}" ${sw} stroke-width="1.6"/>

      <path d="M${cx},${cy - 1}l-1.6,5h2.6" fill="none" stroke="${K}" stroke-width="1"/>
      <path d="M${cx - 3},${cy + 7}q3,1.6 6,0" fill="none" stroke="${R}" stroke-width="1.3" stroke-linecap="round"/>
      ${beard ? `<path d="M${cx - 9},${cy + 3}Q${cx - 8},${cy + 18} ${cx},${cy + 20}Q${cx + 8},${cy + 18} ${cx + 9},${cy + 3}Q${cx + 5},${cy + 10} ${cx},${cy + 10}Q${cx - 5},${cy + 10} ${cx - 9},${cy + 3}Z" fill="#8c6a4a" ${sw} stroke-width="1.2"/>` : `<path d="M${cx - 9.5},${cy - 2}q-2,10 1,14M${cx + 9.5},${cy - 2}q2,10 -1,14" stroke="#7a4a24" stroke-width="3" fill="none"/>`}`;
  }
  function hatFeather(cx, cy, col) {
    return `<path d="M${cx - 16},${cy - 8}Q${cx - 14},${cy - 22} ${cx},${cy - 22}Q${cx + 16},${cy - 22} ${cx + 18},${cy - 8}Q${cx},${cy - 13} ${cx - 16},${cy - 8}Z" fill="${col}" ${sw} stroke-width="1.6"/>
      <path d="M${cx + 10},${cy - 18}C${cx + 22},${cy - 30} ${cx + 30},${cy - 26} ${cx + 36},${cy - 32}C${cx + 32},${cy - 20} ${cx + 22},${cy - 14} ${cx + 12},${cy - 14}Z" fill="#fff" ${sw} stroke-width="1.2"/>`;

  function courtTop(c) {

    if (c.r === 'K') return `

      <path d="M52,62Q70,72 88,62L86,56Q70,66 54,56Z" fill="#fff" ${sw} stroke-width="1.3"/>
      ${face(70, 40, true)}
      <path d="M58,32L55,16L63,24L70,12L77,24L85,16L82,32Z" fill="${Y}" ${sw} stroke-width="1.6"/>
      <rect x="57" y="28" width="26" height="6" fill="${R}" ${sw} stroke-width="1.4"/>
      ${g(sym, 104, 18, 0.16)}`;
    const isU = c.r === 'U';
    return `
      <path d="M16,91L22,62Q40,52 59,54Q78,52 96,62L102,91Z" fill="${m}" ${sw} stroke-width="1.8"/>
      <path d="M44,91L46,60Q59,64 72,60L74,91Z" fill="${s2}" ${sw} stroke-width="1.5"/>
      <path d="M46,72H72M46,82H74" stroke="${Y}" stroke-width="2.2"/>
      <path d="M42,58Q59,68 76,58L74,52Q59,62 44,52Z" fill="#fff" ${sw} stroke-width="1.3"/>
      ${face(59, 38, !isU)}
      ${hatFeather(59, 34, s2)}
      ${isU
        ? `<ellipse cx="88" cy="80" rx="5" ry="4" fill="${SKIN}" ${sw} stroke-width="1.2"/>${g(sym, 16, 78, 0.18)}`
        : `<ellipse cx="94" cy="58" rx="5" ry="4" fill="${SKIN}" ${sw} stroke-width="1.2"/>${g(sym, 16, 18, 0.18)}`}`;
  }

  const SEASON = { hr: ['PROLJEĆE', 'LJETO', 'JESEN', 'ZIMA'], en: ['SPRING', 'SUMMER', 'AUTUMN', 'WINTER'] };
  const SEASON_KIND = ['spring', 'summer', 'autumn', 'winter'];
  const ROMAN = { '7': 'VII', '8': 'VIII', '9': 'IX', '10': 'X' };

  function card(c, lang = 'hr') {
    let b = `<rect x="1" y="1" width="${W - 2}" height="${H - 2}" rx="7" fill="${P}" stroke="#9a9384" stroke-width="1.5"/>`;
    if (ROMAN[c.r]) {
      b += pips(c);
      const t = ROMAN[c.r];
      const ix = `<text x="9" y="16" class="ixr" fill="${K}">${t}</text><text x="${W - 9}" y="16" class="ixr" text-anchor="end" fill="${K}">${t}</text>`;
      b += ix + `<g transform="rotate(180 ${W / 2} ${H / 2})">${ix}</g>`;
    } else if (c.r === 'A') {
      const top = `${scene(8, 8, W - 16, 74, SEASON_KIND[c.s])}`;
      b += top + `<g transform="rotate(180 ${W / 2} ${H / 2})">${top}</g>`;
      b += g(SUIT[c.s], CX, 91, 0.3);
      b += `<path d="M6,84H112L108,91L112,98H6L10,91Z" fill="${P}" ${sw} stroke-width="1.2" opacity=".0"/>`;
      b += `<rect x="6" y="84" width="22" height="14" rx="3" fill="${P}" ${sw} stroke-width="1"/><rect x="${W - 28}" y="84" width="22" height="14" rx="3" fill="${P}" ${sw} stroke-width="1"/>`;
      b += `<text x="17" y="94" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="7" fill="${K}">A</text><text x="${W - 17}" y="94" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="7" fill="${K}">A</text>`;
      b += `<text x="${CX}" y="20" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="7.5" letter-spacing=".6" fill="${K}">${SEASON[lang][c.s]}</text>`;
      b += `<text x="${CX}" y="20" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="7.5" letter-spacing=".6" fill="${K}" transform="rotate(180 ${W / 2} ${H / 2})">${SEASON[lang][c.s]}</text>`;
    } else {
      const top = courtTop(c);
      b += `<rect x="5" y="5" width="${W - 10}" height="${H - 10}" rx="4" fill="none" stroke="${K}" stroke-width="1.2"/>`;
      b += `<g>${top}</g><g transform="rotate(180 ${W / 2} ${H / 2})">${top}</g>`;
      b += `<path d="M5,91H${W - 5}" stroke="${K}" stroke-width="1.2"/>`;
    }

  }
  const back = () => `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
    <rect x="1" y="1" width="${W - 2}" height="${H - 2}" rx="7" fill="${P}" stroke="#9a9384" stroke-width="1.5"/>
    <rect x="6" y="6" width="${W - 12}" height="${H - 12}" rx="4" fill="url(#bkH)" stroke="#4a120e" stroke-width="1.5"/>

  return { card, back, SUIT, W, H };
})();

<script>// ===================== CARD FACES (real deck photos, one sprite per deck) =====================
// Each sprite: rows = engine suits, cols = ranks in B_COLS / H_COLS order.
const Cards = (() => {
  const B_COLS = ['A', '2', '3', '4', '5', '6', '7', 'F', 'C', 'K'];
  const H_COLS = ['7', '8', '9', '10', 'U', 'O', 'K', 'A'];
  const DECKS = {
    triestine: { game: 'b', w: 240, h: 440, name: { hr: 'Tršćanske', en: 'Triestine' }, maker: 'Modiano' },
    trevisane: { game: 'b', w: 212, h: 416, name: { hr: 'Trevižanske', en: 'Trevisane' }, maker: 'Masenghini' },
    trevisane2: { game: 'b', w: 94, h: 194, name: { hr: 'Trevižanske', en: 'Trevisane' }, maker: 'Dal Negro', low: true },
    bergamasche: { game: 'b', w: 216, h: 345, name: { hr: 'Bergamaške', en: 'Bergamasche' }, maker: 'Masenghini' },
    spanish: { game: 'b', w: 213, h: 342, name: { hr: 'Španjolske', en: 'Spanish' }, maker: 'Fournier' },
    hungarian: { game: 'h', w: 154, h: 234, name: { hr: 'Mađarice', en: 'Hungarian' }, maker: 'Piatnik', low: true },
    doppeldeutsche: { game: 'h', w: 240, h: 382, name: { hr: 'Dvostruke njemačke', en: 'Doppeldeutsche' }, maker: 'Piatnik' }
  };
  const sel = { b: 'triestine', h: 'hungarian' };
  const BASE = 'cards/';
  const setDeck = (game, key) => { if (DECKS[key] && DECKS[key].game === game) sel[game] = key; };
  const deckOf = game => sel[game];
  const list = game => Object.keys(DECKS).filter(k => DECKS[k].game === game);
  function face(game, c, key) {
    key = key || sel[game];
    const d = DECKS[key], cols = game === 'b' ? B_COLS : H_COLS, C = cols.length;
    const col = cols.indexOf(c.r), row = c.s;
    return `<div class="ci" style="aspect-ratio:${d.w}/${d.h};background-image:url(${BASE}${key}.webp);background-size:${C * 100}% 400%;background-position:${(col / (C - 1) * 100).toFixed(3)}% ${(row / 3 * 100).toFixed(3)}%"></div>`;
  }
  function back(game, key) {
    const d = DECKS[key || sel[game]];
    return `<div class="ci back ${game}" style="aspect-ratio:${d.w}/${d.h}"></div>`;
  }
  const ratio = (game, key) => { const d = DECKS[key || sel[game]]; return d.h / d.w; };
  const suitIcon = (game, s, size = 18) => `<svg viewBox="-50 -50 100 100" width="${size}" height="${size}" aria-hidden="true">${(game === 'b' ? Triestine.SUIT : Madjarice.SUIT)[s]}</svg>`;
  // ---- French-suited 52-card decks (Solitaire and other French-deck games)
  // english.webp: 13 x 5 sprite of 240 x 360 cards; rows S H D C in ranks A..K, last row: -, black and red joker, blank, blue/red/purple/yellow backs
  const FR = {
    english: { w: 240, h: 360, name: { hr: 'Engleske', en: 'English pattern' }, maker: 'Wikimedia Commons', backs: ['blue', 'red', 'purple', 'yellow'] },
    kennard: { w: 240, h: 336, name: { hr: 'Engleske (Kennard)', en: 'English (Kennard)' }, maker: 'Adrian Kennard', backs: ['red'] }
  };
  const FR_RANKS = ['a', '2', '3', '4', '5', '6', '7', '8', '9', '10', 'j', 'q', 'k'];
  const frDeck = k => FR[k] ? k : 'english';
  const sprite = (k, col, row) => `<div class="ci" style="aspect-ratio:${FR[k].w}/${FR[k].h};height:100%;background-image:url(${BASE}${k}.webp);background-size:1300% 500%;background-position:${(col / 12 * 100).toFixed(3)}% ${(row / 4 * 100).toFixed(3)}%"></div>`;
  // key like 'Sa', 'H10', 'Dk'
  function frFace(key, deck) {
    deck = frDeck(deck);
    if (deck === 'kennard') return FRENCH[key];
    return sprite(deck, FR_RANKS.indexOf(key.slice(1)), 'SHDC'.indexOf(key[0]));
  }
  function frBack(deck, color) {
    deck = frDeck(deck);
    if (deck === 'kennard') return FRENCH.B2;
    const i = Math.max(0, FR[deck].backs.indexOf(color));
    return sprite(deck, 4 + i, 4);
  }
  // the jokers: the English-pattern deck has its own (black and red); otherwise a plain drawn joker
  function frJoker(deck, color) {
    deck = frDeck(deck);
    if (deck === 'english') return sprite(deck, color === 'R' ? 2 : 1, 4);
    const ink = color === 'R' ? '#c0302a' : '#1b1b1b';
    return `<svg viewBox="0 0 240 336" xmlns="http://www.w3.org/2000/svg"><rect x="1" y="1" width="238" height="334" rx="14" fill="#fff" stroke="#999" stroke-width="2"/><text x="120" y="190" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="44" fill="${ink}" letter-spacing="4">JOKER</text><path d="M120 70l14 30 32 4-24 22 6 32-28-16-28 16 6-32-24-22 32-4z" fill="${ink}"/><text x="22" y="48" font-family="Georgia,serif" font-weight="700" font-size="30" fill="${ink}">J</text></svg>`;
  }
  const frRatio = deck => FR[frDeck(deck)].h / FR[frDeck(deck)].w;

  return { FR, frFace, frBack, frJoker, frRatio, frDeck, DECKS, setDeck, deckOf, list, face, back, ratio, suitIcon, DEFS: '' };
})();

<script>// ===================== SOLITAIRE (Klondike) =====================
// Rules: 52 cards, 7 tableau piles (1..7 cards, top card face up), build down in alternating colours,
// foundations up by suit from Ace to King, only a King (or a King-led run) fills an empty pile.
// Options: draw 1 or 3, passes through the stock (unlimited / 3 / 1), scoring standard / Vegas / none, timed.
const Solitaire = (() => {
  // ---------------------------------------------------------------- engine (pure)
  const SUITS = ['S', 'H', 'D', 'C'], RANK = { 1: 'a', 11: 'j', 12: 'q', 13: 'k' };
  const red = c => c.s === 'H' || c.s === 'D';
  const cid = c => c.s + (RANK[c.r] || c.r);
  function newDeal(opts, rng = Math.random) {
    const deck = [];
    for (const s of SUITS) for (let r = 1; r <= 13; r++) deck.push({ s, r, up: false });
    for (let i = deck.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [deck[i], deck[j]] = [deck[j], deck[i]]; }
    const tab = [];
    for (let p = 0; p < 7; p++) { tab.push(deck.splice(0, p + 1)); tab[p][p].up = true; }
    return {
      opts: { ...opts }, deal: deck.concat(...tab).map(cid).join(','),
      stock: deck, waste: [], found: [[], [], [], []], tab,
      pass: 0, score: opts.scoring === 'vegas' ? -52 : 0, moves: 0, time: 0, started: false, won: false,
    };
  }
  const clone = st => JSON.parse(JSON.stringify(st));
  const top = a => a[a.length - 1];
  const canFound = (c, f) => f.length ? (top(f).s === c.s && c.r === top(f).r + 1) : c.r === 1;
  const canTab = (c, p) => p.length ? (top(p).up && red(top(p)) !== red(c) && c.r === top(p).r - 1) : c.r === 13;
  const passLimit = st => st.opts.passes === 'inf' ? Infinity : +st.opts.passes;
  const canRecycle = st => !st.stock.length && st.waste.length > 0 && st.pass + 1 < passLimit(st);
  function addScore(st, kind) {
    const sc = st.opts.scoring;
    if (sc === 'standard') {
      const v = { wasteTab: 5, toFound: 10, flip: 5, fromFound: -15, recycle: st.opts.draw === 1 ? -100 : (st.pass >= 3 ? -20 : 0) }[kind] || 0;
      st.score = Math.max(0, st.score + v);
    } else if (sc === 'vegas') {
      if (kind === 'toFound') st.score += 5;
      if (kind === 'fromFound') st.score -= 5;
    }
  }
  // draw from the stock, or turn the waste over when the stock is empty
  function draw(st) {
    if (st.stock.length) {
      const n = Math.min(st.opts.draw, st.stock.length);
      for (let i = 0; i < n; i++) { const c = st.stock.pop(); c.up = true; st.waste.push(c); }
      st.moves++; return true;
    }
    if (canRecycle(st)) {
      st.stock = st.waste.reverse().map(c => ({ ...c, up: false })); st.waste = []; st.pass++;
      addScore(st, 'recycle'); st.moves++; return true;
    }
    return false;
  }
  // source: { pile: 'waste' | 'tab' | 'found', i, idx } ; target: { pile: 'tab' | 'found', i }
