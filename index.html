<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cardshark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/svg+xml" href="icons/mark.svg">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Cardshark</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#173b2f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700;800&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: one-screen card table on baize, walnut rail, brass accents; home is a scrolling menu of two games */
:root{
  --felt:#1c4a3a; --felt-hi:#24604b; --felt-lo:#123228;
  --rail:#3a2416; --rail-hi:#5c3a24;
  --ink:#f3ecd9; --muted:#a8c0b2; --faint:rgba(243,236,217,.14);
  --brass:#d6ab52; --brass-ink:#2b1b08; --alert:#e9876a; --good:#9fd49a;
  --sheet:#f6efdd; --sheet-ink:#2a2118; --sheet-line:#c9bb98; --sheet-muted:#7a6a52;
  --display:"Alegreya SC", "Palatino Linotype", Georgia, serif;
  --body:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
html,body{height:100%}
body{margin:0;background:var(--felt-lo);color:var(--ink);font-family:var(--body);font-size:16px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
#app{height:100%;box-sizing:border-box;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  background:radial-gradient(120% 80% at 50% 30%, var(--felt-hi), var(--felt) 45%, var(--felt-lo));}
.svgc svg{display:block;width:100%;height:auto}
.ix{font:700 12px Georgia, "Times New Roman", serif} .ixr{font:700 12px Georgia, "Times New Roman", serif}
.lbl{font:800 7.2px var(--display);text-anchor:middle;letter-spacing:.4px}

/* ---------- HOME ---------- */
#home{height:100%;overflow-y:auto;padding-block:20px 32px;box-sizing:border-box}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;flex-direction:column-reverse;gap:10px;padding-top:2px}
.brand .lang{align-self:flex-end}
.bl{display:flex;align-items:flex-end;gap:12px;min-width:0}
.logo{width:clamp(64px,19vw,92px);aspect-ratio:1;flex:none;border-radius:22%;background:var(--felt);overflow:hidden;display:flex;align-items:flex-end;justify-content:center;box-shadow:inset 0 0 0 1px var(--faint)}
.logo svg{width:88%;margin-bottom:-2px}
.brand h1{font:800 clamp(36px,11vw,60px)/.9 var(--display);margin:0;color:var(--ink)}
.brand h1 span{color:var(--brass)}
.brand p{margin:6px 0 0;color:var(--muted);font-size:14px;max-width:26ch}
.lang{display:flex;border:1px solid var(--faint);border-radius:99px;overflow:hidden;flex:none}
.lang button{background:none;border:0;padding:7px 12px;font-weight:700;font-size:13px;letter-spacing:.06em;color:var(--muted);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--brass);color:var(--brass-ink)}
.game{background:linear-gradient(180deg, rgba(0,0,0,.18), rgba(0,0,0,.28));border:1px solid var(--faint);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.game-top{display:flex;gap:14px;align-items:center}
.fan{position:relative;width:118px;height:96px;flex:none}
.fan .svgc{position:absolute;width:52px;bottom:4px;left:30px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.4));transform-origin:50% 120%}
.game h2{font:800 30px/1 var(--display);margin:0}
.game .sub{color:var(--muted);font-size:14px;margin:4px 0 0;line-height:1.35}
.opt{display:flex;flex-direction:column;gap:6px}
.opt>span{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 auto;min-width:64px;background:rgba(0,0,0,.22);border:1px solid var(--faint);border-radius:10px;padding:9px 10px;cursor:pointer;font-size:15px;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--felt-lo);border-color:var(--ink);font-weight:700}
.note{font-size:13px;color:var(--muted);margin:0}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--ink);cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--brass);margin:0;flex:none}
.play{background:var(--brass);color:var(--brass-ink);border:0;border-radius:12px;padding:13px 16px;font:800 20px var(--display);letter-spacing:.04em;cursor:pointer;box-shadow:0 3px 0 #8a6a28}
.play:active{transform:translateY(2px);box-shadow:0 1px 0 #8a6a28}
.prefs{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ghost{background:none;border:1px solid var(--faint);border-radius:12px;padding:11px;color:var(--ink);cursor:pointer;font-weight:700}
.foot{color:var(--muted);font-size:12.5px;text-align:center;margin:0}
@media (max-width:420px){.prefs{grid-template-columns:1fr}}

/* ---------- TABLE ---------- */
#table{height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto}
.bar{display:flex;align-items:center;gap:8px;padding-block:8px 6px}
.ib{width:38px;height:38px;border-radius:10px;border:1px solid var(--faint);background:rgba(0,0,0,.2);display:grid;place-items:center;cursor:pointer;flex:none}
.ib svg{width:20px;height:20px}
.chip{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.25);border:1px solid var(--faint);border-radius:99px;padding:5px 11px;font-size:14px;white-space:nowrap;min-width:0}
.chip b{font-family:var(--display);font-size:16px}
.chip.score{font-variant-numeric:tabular-nums;margin-left:auto}
.chip .k{color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.felt{position:relative;flex:1;min-height:0;border-radius:26px;border:7px solid var(--rail);
  background:radial-gradient(90% 70% at 50% 45%, var(--felt-hi), var(--felt) 60%, #17402f);
  box-shadow:inset 0 0 0 2px var(--rail-hi), inset 0 10px 30px rgba(0,0,0,.35), 0 6px 18px rgba(0,0,0,.35);overflow:hidden}
.seat{position:absolute;display:flex;flex-direction:column;align-items:center;gap:4px;z-index:2;transition:opacity .2s}
.seat.s2{top:8px;left:50%;transform:translateX(-50%)}
.seat.s1{right:6px;top:21%;align-items:flex-end}
.seat.s3{left:6px;top:21%;align-items:flex-start}
.who{display:flex;align-items:center;gap:6px;font-weight:700;font-size:13.5px;background:rgba(0,0,0,.28);border-radius:99px;padding:3px 9px 3px 3px;border:1px solid transparent;white-space:nowrap}
.av{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:800 13px var(--display);background:var(--ink);color:var(--felt-lo)}
.seat.mate .av{background:var(--brass);color:var(--brass-ink)}
.seat.turn .who{border-color:var(--brass);box-shadow:0 0 0 3px rgba(214,171,82,.25)}
.tag{font-size:10.5px;font-weight:800;letter-spacing:.06em;border-radius:5px;padding:1px 5px;background:var(--ink);color:var(--felt-lo)}
.tag.call{background:var(--brass);color:var(--brass-ink)}
.mini{display:flex;height:34px}
.mini .svgc{width:22px;margin-left:-14px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.4))}
.mini .svgc:first-child{margin-left:0}
.mini.open .svgc{width:34px;margin-left:-12px}
.mini.open{height:56px}
#center{position:absolute;inset:0;z-index:1}
.tc{position:absolute;width:var(--tw);transform:translate(-50%,-50%) rotate(var(--r,0deg));filter:drop-shadow(0 4px 6px rgba(0,0,0,.45));pointer-events:none}
.stock{position:absolute;left:12px;bottom:12px;width:calc(var(--tw)*1.75);height:calc(var(--tw)*1.5);z-index:1}
.stock .tr{position:absolute;width:calc(var(--tw)*.8);left:calc(var(--tw)*.55);top:50%;transform:translateY(-50%) rotate(90deg)}
.stock .pile{position:absolute;width:calc(var(--tw)*.8);left:0;top:0;filter:drop-shadow(2px 3px 0 #0f2a20)}
.stock .cnt{position:absolute;left:calc(var(--tw)*.4);top:50%;transform:translate(-50%,-50%);font:800 15px var(--display);background:rgba(0,0,0,.6);border-radius:8px;padding:1px 7px;font-variant-numeric:tabular-nums}
.bubble{position:absolute;z-index:5;background:var(--sheet);color:var(--sheet-ink);font-weight:700;font-size:14px;border-radius:12px;padding:6px 11px;box-shadow:0 4px 12px rgba(0,0,0,.35);white-space:nowrap;transform:translate(-50%,-50%);animation:pop .22s ease-out;display:flex;align-items:center;gap:6px}
.bubble.gold{background:var(--brass);color:var(--brass-ink)}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.7);opacity:0}}
.action{min-height:52px;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;padding-block:8px 4px;text-align:center}
.msg{font-size:15px;color:var(--ink)}
.msg .m{color:var(--muted)}
.bid{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;width:100%}
.bid button{display:flex;align-items:center;gap:6px;background:var(--sheet);color:var(--sheet-ink);border:0;border-radius:10px;padding:8px 11px;font-weight:700;font-size:15px;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.35)}
.bid button.pass{background:rgba(0,0,0,.3);color:var(--ink);border:1px solid var(--faint);box-shadow:none}
.bid button:disabled{opacity:.35;cursor:not-allowed}
.hand{position:relative;flex:none;margin-bottom:10px}
.hc{position:absolute;bottom:0;width:var(--cw);transition:transform .16s ease, filter .16s;cursor:pointer;filter:drop-shadow(0 3px 5px rgba(0,0,0,.45));border:0;background:none;padding:0}
.hc.sel{transform:translateY(-22%)}
.hc.off{filter:brightness(.55) saturate(.6);cursor:default}
.hc.talon{filter:brightness(.8)}
.hand.live .hc:not(.off):not(.sel):hover{transform:translateY(-8%)}

/* ---------- SHEET (overlays) ---------- */
.veil{position:fixed;inset:0;z-index:20;background:rgba(6,16,12,.6);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--sheet);color:var(--sheet-ink);width:100%;max-width:520px;max-height:88%;overflow-y:auto;border-radius:20px 20px 0 0;box-sizing:border-box;
  padding-block:20px calc(20px + env(safe-area-inset-bottom, 0px));padding-left:max(18px, env(safe-area-inset-left, 0px));padding-right:max(18px, env(safe-area-inset-right, 0px));
  box-shadow:0 -8px 30px rgba(0,0,0,.4);animation:up .25s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
@media (min-width:640px){.veil{align-items:center}.sheet{border-radius:20px}}
.sheet h3{font:800 28px/1.05 var(--display);margin:0 0 6px;text-wrap:balance}
.sheet h4{font:800 19px var(--display);margin:18px 0 6px}
.sheet p,.sheet li{line-height:1.45;font-size:15.5px}
.sheet ul{padding-left:20px;margin:6px 0}
.sheet .muted{color:var(--sheet-muted)}
.big{display:flex;align-items:baseline;justify-content:center;gap:14px;font:800 52px/1 var(--display);margin:14px 0 4px;font-variant-numeric:tabular-nums}
.big small{font:700 14px var(--body);color:var(--sheet-muted);letter-spacing:.1em;text-transform:uppercase;display:block;text-align:center}
.big .sep{color:var(--sheet-line)}
.verdict{text-align:center;font-weight:700;font-size:17px;margin:4px 0 14px}
.tally{display:flex;justify-content:center;gap:24px;margin:8px 0 16px;font-variant-numeric:tabular-nums}
.tally div{text-align:center}
.tally b{display:block;font:800 26px var(--display)}
.marks{font:700 22px var(--display);letter-spacing:2px;color:var(--sheet-ink)}
.btns{display:flex;gap:10px;margin-top:16px}
.btns button{flex:1;border-radius:12px;padding:13px;font:800 18px var(--display);cursor:pointer;border:0}
.btns .pri{background:var(--felt);color:var(--ink)}
.btns .sec{background:transparent;border:1.5px solid var(--sheet-line);color:var(--sheet-ink)}
table.pis{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;margin-top:8px}
.pis th{font:800 20px var(--display);border-bottom:2px solid var(--sheet-ink);padding:4px 6px}
.pis td{padding:6px;border-bottom:1px dashed var(--sheet-line);text-align:center;font-size:17px}
.pis td.n{color:var(--sheet-muted);font-size:13px;width:28px;text-align:left}
.pis td.note{font-size:12.5px;color:var(--sheet-muted);text-align:left;line-height:1.25}
.pis tr.tot td{border-bottom:0;border-top:2px solid var(--sheet-ink);font:800 22px var(--display)}
.pis .x{color:#b4432c;font-weight:700}
.pisw{overflow-x:auto}
.trickview{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
.trickview figure{margin:0;width:68px;text-align:center;font-size:12px;color:var(--sheet-muted)}
.trickview figure.w{color:var(--sheet-ink);font-weight:800}
.trickview figure.w .svgc{outline:3px solid var(--brass);border-radius:9px}
.decl{display:flex;flex-direction:column;gap:4px;margin:8px 0}
.decl div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--sheet-line);padding:4px 0}
.rank{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px 14px;font-size:14.5px;margin:6px 0}
.rank div{display:flex;justify-content:space-between;border-bottom:1px dashed var(--sheet-line)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div id="defs"></div>
<div id="app">
  <section id="home"></section>
  <section id="table" hidden>
    <header class="bar">
      <button class="ib" id="bHome" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="chip" id="trumpChip"></div>
      <div class="chip score" id="scoreChip"></div>
      <button class="ib" id="bLast" aria-label="Last trick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 12a8 8 0 1 0 3-6.2"/><path d="M4 4v5h5"/></svg></button>
      <button class="ib" id="bRules" aria-label="Rules"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14"/><circle cx="12" cy="17.2" r=".6" fill="currentColor"/></svg></button>
    </header>
    <div class="felt" id="felt">
      <div class="seat s2" id="seat2"></div>
      <div class="seat s1" id="seat1"></div>
      <div class="seat s3" id="seat3"></div>
      <div class="stock" id="stock" hidden></div>
      <div id="center"></div>
    </div>
    <div class="action" id="action"></div>
    <div class="hand" id="hand"></div>
  </section>
</div>
<div id="overlay"></div>

<script>// ===================== ENGINE (pure game logic + AI) =====================
const Engine = (() => {
  const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const sum = (a, f) => a.reduce((x, y) => x + f(y), 0);

  // ---------- shared seat helpers ----------
  function teamOf(st, seat) { return st.seats.length === 2 ? (seat === 0 ? 0 : 1) : seat % 2; }
  function nextSeat(st, s) { const i = st.seats.indexOf(s); return st.seats[(i + 1) % st.seats.length]; }
  function roundFrom(st, s) { const o = []; for (let i = 0; i < st.seats.length; i++) { o.push(s); s = nextSeat(st, s); } return o; }

  // =============================== BRIŠKULA ===============================
  // Triestine 40-card deck. Rank order A,3,K(re),C(cavallo/konj),F(fante),7,6,5,4,2
  const B_RANKS = [
    { k: 'A', n: 1, st: 10, p: 11 }, { k: '3', n: 3, st: 9, p: 10 }, { k: 'K', n: 13, st: 8, p: 4 },
    { k: 'C', n: 12, st: 7, p: 3 }, { k: 'F', n: 11, st: 6, p: 2 }, { k: '7', n: 7, st: 5, p: 0 },
    { k: '6', n: 6, st: 4, p: 0 }, { k: '5', n: 5, st: 3, p: 0 }, { k: '4', n: 4, st: 2, p: 0 }, { k: '2', n: 2, st: 1, p: 0 }];
  function bDeck() { const d = []; for (let s = 0; s < 4; s++) for (const r of B_RANKS) d.push({ id: 'b' + s + r.k, s, r: r.k, n: r.n, st: r.st, p: r.p }); return d; }

  function bNew(opts) {
    const seats = opts.players === 4 ? [0, 1, 2, 3] : [0, 2];
    return { game: 'b', opts, seats, dealer: seats[seats.length - 1], wins: [0, 0], history: [] };
  }
  function bDeal(st) {
    const deck = shuffle(bDeck());
    const hs = st.opts.double ? 4 : 3;
    st.hands = {}; st.seats.forEach(s => st.hands[s] = []);
    let s = nextSeat(st, st.dealer);
    for (let i = 0; i < hs * st.seats.length; i++) { st.hands[s].push(deck.pop()); s = nextSeat(st, s); }
    st.stock = deck;               // drawn with pop(); stock[0] is the face-up trump card (drawn last)
    st.trumpCard = deck[0]; st.trump = deck[0].s;
    st.leader = nextSeat(st, st.dealer);
    st.trick = []; st.won = [[], []]; st.seen = new Set(); st.lastTrick = null; st.trickNo = 0;
  }
  function bOrder(st) { const o = roundFrom(st, st.leader); return st.opts.double ? o.concat(o) : o; }
  function bToPlay(st) { return bOrder(st)[st.trick.length]; }
  function bBeats(a, b, T) { return a.s === b.s ? a.st > b.st : a.s === T; }
  function bWinnerIdx(trick, T) { let w = 0; for (let i = 1; i < trick.length; i++) if (bBeats(trick[i].card, trick[w].card, T)) w = i; return w; }
  function bPlay(st, seat, card) {
    const h = st.hands[seat]; h.splice(h.findIndex(c => c.id === card.id), 1);
    st.trick.push({ seat, card }); st.seen.add(card.id);
    return st.trick.length === bOrder(st).length;
  }
  function bFinishTrick(st) {
    const w = st.trick[bWinnerIdx(st.trick, st.trump)].seat;
    st.won[teamOf(st, w)].push(...st.trick.map(t => t.card));
    st.lastTrick = { trick: st.trick, winner: w, pts: sum(st.trick, t => t.card.p) };
    st.trick = []; st.leader = w; st.trickNo++;
    const draws = [];
    if (st.stock.length) {
      const rounds = st.opts.double ? 2 : 1;
      for (let r = 0; r < rounds; r++) for (const s of roundFrom(st, w)) { const c = st.stock.pop(); st.hands[s].push(c); draws.push({ seat: s, card: c }); }
    }
    return { winner: w, draws };
  }
  function bHandOver(st) { return st.trick.length === 0 && st.seats.every(s => st.hands[s].length === 0); }
  function bPoints(st) { return st.won.map(cs => sum(cs, c => c.p)); }

  function bAI(st, seat) {
    const hand = st.hands[seat], T = st.trump, order = bOrder(st), pos = st.trick.length;
    const after = order.slice(pos + 1), me = teamOf(st, seat);
    const oppAfter = after.filter(s => teamOf(st, s) !== me).length;
    const partnerAfter = after.some(s => s !== seat && teamOf(st, s) === me);
    const known = new Set([...st.seen, ...hand.map(c => c.id)]);
    const unk = bDeck().filter(c => !known.has(c.id));
    const unkT = unk.filter(c => c.s === T);
    const tablePts = sum(st.trick, t => t.card.p);
    const curW = pos ? st.trick[bWinnerIdx(st.trick, T)] : null;
    const late = st.stock.length === 0;
    const pHold = (card) => {
      if (!oppAfter) return 1;
      let one;
      if (card.s === T) { const u = unkT.filter(c => c.st > card.st).length; one = u === 0 ? 1 : Math.max(0.1, Math.pow(0.74, u)); }
      else {
        const h = unk.filter(c => c.s === card.s && c.st > card.st).length;
        one = Math.pow(0.86, h) * (unkT.length ? Math.max(0.3, 1 - 0.1 * Math.min(unkT.length, 7)) : 1);
      }
      return Math.pow(one, oppAfter);
    };
    let best = null;
    for (const c of hand) {
      const iWin = !curW || bBeats(c, curW.card, T);
      let pWin;
      if (iWin) { const ph = pHold(c); pWin = ph + (1 - ph) * (partnerAfter ? 0.25 : 0); }
      else if (teamOf(st, curW.seat) === me) pWin = pHold(curW.card);
      else pWin = partnerAfter ? 0.3 : 0;
      let ev = (2 * pWin - 1) * (tablePts + c.p + after.length * 1.6);

  // ================================= BELA =================================
  // Mađarice (German-suited, William Tell). Suits: 0 Herc, 1 Bundeva(zvono), 2 Zeleni(list), 3 Žir
  const H_KEYS = ['7', '8', '9', '10', 'U', 'O', 'K', 'A'];
  const T_STR = { '7': 1, '8': 2, 'O': 3, 'K': 4, '10': 5, 'A': 6, '9': 7, 'U': 8 };
  const N_STR = { '7': 1, '8': 2, '9': 3, 'U': 4, 'O': 5, 'K': 6, '10': 7, 'A': 8 };
  const T_PTS = { 'U': 20, '9': 14, 'A': 11, '10': 10, 'K': 4, 'O': 3 };
  const N_PTS = { 'A': 11, '10': 10, 'K': 4, 'O': 3, 'U': 2 };
  function hDeck() { const d = []; for (let s = 0; s < 4; s++) H_KEYS.forEach((k, q) => d.push({ id: 'h' + s + k, s, r: k, q })); return d; }
  const hStr = (c, T) => c.s === T ? 100 + T_STR[c.r] : N_STR[c.r];

  }
  function hBidValue(hand, s) {

    }
    if (tr.length >= 3) v += 4;
    if (tr.some(c => c.r === 'U') && tr.some(c => c.r === '9')) v += 4;
    if (tr.some(c => c.r === 'K') && tr.some(c => c.r === 'O')) v += 4;
    return v;
  }
  // returns suit index, or -1 to pass
  function hAIBid(st, seat) {
    const hand = st.hands[seat]; let best = 0, bv = -1;
    for (let s = 0; s < 4; s++) { const v = hBidValue(hand, s); if (v > bv) { bv = v; best = s; } }
    const forced = seat === st.dealer;
    return (forced || bv >= 38) ? best : -1;
  }
  function hBid(st, seat, suit) {

    if (suit >= 0) {
      st.trump = suit; st.caller = seat;
      for (const s of st.seats) st.hands[s].push(...st.talon[s]);

      for (const s of st.seats) {

    }

  }
  function hFindDecls(hand) {

    for (let s = 0; s < 4; s++) {
      const qs = hand.filter(c => c.s === s).map(c => c.q).sort((a, b) => a - b);
      let i = 0;
      while (i < qs.length) {

    if (belaTeam >= 0 && st.belaCalled && st.tricks[belaTeam] > 0) declPts[belaTeam] += 20;
    let stiglja = -1;
    for (const t of [0, 1]) if (st.tricks[t] === 8) { pts[t] += 90; stiglja = t; }
    const tot = [pts[0] + declPts[0], pts[1] + declPts[1]];
    const all = tot[0] + tot[1];
    let result, add = [0, 0], hangUse = st.hang;
    if (tot[c] > tot[o]) { result = 'pass'; add = tot.slice(); add[c] += st.hang; st.hang = 0; }
    else if (tot[c] < tot[o]) { result = 'fall'; add[o] = all + st.hang; st.hang = 0; }
    else { result = 'hang'; add[o] = tot[o]; st.hang += tot[c]; hangUse = 0; }
    st.score[0] += add[0]; st.score[1] += add[1];

  }

    const led = pos ? st.trick[0].card.s : null;

      const v = st.void[opp];

      if (pos === 0) {

        if (c.s === T && !isMaster(c) && !callerTeam) ev -= 4;
      }
      if (seat === st.belaSeat && !st.belaCalled && c.s === T && (c.r === 'K' || c.r === 'O')) ev += 1;
      ev += Math.random() * 0.2;
      if (!best || ev > best.ev) best = { c, ev };
    }

  }

  return {
    shuffle, teamOf, nextSeat, roundFrom,
    B_RANKS, bDeck, bNew, bDeal, bOrder, bToPlay, bBeats, bWinnerIdx, bPlay, bFinishTrick, bHandOver, bPoints, bAI,
    H_KEYS, hDeck, hStr, hPts, hNew, hDeal, hAIBid, hBid, hFindDecls, hLegal, hWinnerIdx, hToPlay, hPlay, hFinishTrick, hHandOver, hScoreHand, hMatchWinner, hAI, hBidValue

      ${beard ? `<path d="M${cx - 9},${cy + 3}Q${cx - 8},${cy + 18} ${cx},${cy + 20}Q${cx + 8},${cy + 18} ${cx + 9},${cy + 3}Q${cx + 5},${cy + 10} ${cx},${cy + 10}Q${cx - 5},${cy + 10} ${cx - 9},${cy + 3}Z" fill="#8c6a4a" ${sw} stroke-width="1.2"/>` : ''}`;
  }
  function courtTop(c) {

    const holdSc = c.s === 2 || c.s === 3 ? 0.3 : 0.2;
    if (c.r === 'K') return `
      <path d="M8,88L14,58Q26,48 42,50L52,62L62,50Q78,48 90,58L96,88Z" fill="${m}" ${sw} stroke-width="1.8"/>
      <path d="M36,88L40,58L52,64L64,58L68,88Z" fill="${s2}" ${sw} stroke-width="1.6"/>
      <path d="M40,70H64M39,79H65" stroke="${Y}" stroke-width="2.4"/>
      <path d="M28,56Q52,70 76,56L74,50Q52,62 30,50Z" fill="#fff" ${sw} stroke-width="1.4"/>
      ${[34, 44, 52, 60, 70].map(x => `<circle cx="${x}" cy="${57 + (x === 52 ? 4 : x === 44 || x === 60 ? 2.5 : 0)}" r="1" fill="${K}"/>`).join('')}
      <path d="M22,88L28,44" stroke="${K}" stroke-width="4.4" stroke-linecap="round"/><path d="M22,88L28,44" stroke="${Y}" stroke-width="2.4" stroke-linecap="round"/><circle cx="28.5" cy="41" r="4" fill="${Y}" ${sw} stroke-width="1.4"/>
      ${face(52, 34, true)}
      <path d="M40,26L37,10L45,18L52,6L59,18L67,10L64,26Z" fill="${Y}" ${sw} stroke-width="1.6"/>
      <rect x="39" y="22" width="26" height="6" fill="${R}" ${sw} stroke-width="1.4"/>
      <circle cx="52" cy="13" r="1.8" fill="${B}"/><circle cx="45" cy="25" r="1.4" fill="${Y}"/><circle cx="59" cy="25" r="1.4" fill="${Y}"/>
      <ellipse cx="78" cy="70" rx="5" ry="4" fill="${SKIN}" ${sw} stroke-width="1.2"/>

    if (c.r === 'F') return `
      <path d="M14,88L20,58Q36,48 52,50Q68,48 84,58L90,88Z" fill="${m}" ${sw} stroke-width="1.8"/>
      <path d="M30,88V56M44,88V51M60,88V51M74,88V56" stroke="${s2}" stroke-width="5"/>
      <path d="M30,88V56M44,88V51M60,88V51M74,88V56" stroke="${K}" stroke-width=".8" transform="translate(2.5 0)"/>
      <path d="M36,52Q52,62 68,52L66,48Q52,56 38,48Z" fill="#fff" ${sw} stroke-width="1.3"/>
      ${face(52, 36, false)}
      <path d="M38,30Q38,14 54,14Q70,15 70,28Q60,22 50,23Q42,24 38,30Z" fill="${s2}" ${sw} stroke-width="1.6"/>
      <path d="M66,20C76,10 84,12 88,6C86,16 78,22 68,24Z" fill="${Y}" ${sw} stroke-width="1.2"/>
      <ellipse cx="24" cy="74" rx="5" ry="4" fill="${SKIN}" ${sw} stroke-width="1.2"/>
      ${g(sym, 22, 62, holdSc)}`;
    // Cavallo: horse head and neck on the left, rider on the right
    return `
      <path d="M6,88C8,66 12,52 24,46C26,38 30,32 36,34L40,44C36,48 33,54 35,62C37,72 40,80 41,88Z" fill="#f4ecd8" ${sw} stroke-width="1.8"/>
      <path d="M24,46C20,40 14,38 10,40C8,46 10,52 16,54C20,54 23,51 24,46Z" fill="#f4ecd8" ${sw} stroke-width="1.6"/>
      <circle cx="15" cy="45" r="1.6" fill="${K}"/>
      <path d="M36,34C42,40 44,50 42,60C44,68 44,78 46,88" fill="none" stroke="${R}" stroke-width="5"/>
      <path d="M12,49L24,48L32,40" fill="none" stroke="${B}" stroke-width="2"/>
      <path d="M44,88L48,60Q64,50 82,58L90,88Z" fill="${m}" ${sw} stroke-width="1.8"/>
      <path d="M50,72H86" stroke="${s2}" stroke-width="5"/>
      ${face(66, 36, false)}
      <path d="M54,30Q54,16 66,15Q79,15 80,30Z" fill="${s2}" ${sw} stroke-width="1.6"/>
      <path d="M72,16C80,6 90,8 94,4C92,14 84,18 76,20Z" fill="${R}" ${sw} stroke-width="1.2"/>
      <ellipse cx="88" cy="70" rx="4.5" ry="3.6" fill="${SKIN}" ${sw} stroke-width="1.2"/>
      ${g(sym, 88, 60, holdSc * 0.9)}`;
  }

  const IT_SUIT = ['COPPE', 'DANARI', 'SPADE', 'BASTONI'];
  const IT_COURT = { F: 'FANTE', C: 'CAVAL.', K: 'RE' };
  const idx = n => `<text x="8" y="17" class="ix" fill="${K}">${n}</text><text x="8" y="17" class="ix" fill="${K}" transform="rotate(180 ${W / 2} ${H / 2})">${n}</text>`;
  function ribbon(y, text, size = 6.4) {
    return `<path d="M10,${y - 7}H94L90,${y}L94,${y + 7}H10L14,${y}Z" fill="${P}" ${sw} stroke-width="1.2"/>
      <text x="${W / 2}" y="${y + 2.3}" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="${size}" letter-spacing=".3" fill="${K}">${text}</text>`;
  }

  function card(c) {
    let b = `<rect x="1" y="1" width="${W - 2}" height="${H - 2}" rx="7" fill="${P}" stroke="#9a9384" stroke-width="1.5"/>`;
    if (['F', 'C', 'K'].includes(c.r)) {
      const top = courtTop(c);
      b += `<rect x="5" y="5" width="${W - 10}" height="${H - 10}" rx="3" fill="none" stroke="${K}" stroke-width="1.4"/>`;
      b += `<g>${top}</g><g transform="rotate(180 ${W / 2} ${H / 2})">${top}</g>`;
      b += `<rect x="5" y="87" width="${W - 10}" height="18" fill="${P}" stroke="${K}" stroke-width="1.4"/>`;
      b += `<text x="${W / 2}" y="98.6" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="7.6" letter-spacing=".4" fill="${K}">${IT_COURT[c.r]} DI ${IT_SUIT[c.s]}</text>`;
      b += `<rect x="5" y="5" width="16" height="16" fill="${P}" stroke="${K}" stroke-width="1"/><rect x="${W - 21}" y="${H - 21}" width="16" height="16" fill="${P}" stroke="${K}" stroke-width="1"/>`;
      b += `<text x="13" y="17" text-anchor="middle" class="ix" fill="${K}">${c.n}</text><text x="13" y="17" text-anchor="middle" class="ix" fill="${K}" transform="rotate(180 ${W / 2} ${H / 2})">${c.n}</text>`;
    } else if (c.n === 1) {
      if (c.s === 1) {
        b += [30, 90, 150, 210, 270, 330].map(a => `<g transform="rotate(${a} 52 86)"><path d="M52,50C58,42 66,42 70,47C65,49 60,52 52,50Z" fill="${GRN}" ${sw} stroke-width="1.1"/></g>`).join('');
        b += g(coinArt, 52, 86, 0.66);
        b += ribbon(160, 'ASSO DI DANARI');
      } else if (c.s === 0) {
        b += g(cupArt, 52, 82, 0.86);
        b += sprig(30, 140, 0) + sprig(74, 140, 0);
        b += ribbon(160, 'ASSO DI COPPE');
      } else if (c.s === 2) {
        b += g(swordArt, 52, 88, 1.18);
        b += `<path d="M30,60C44,52 60,70 74,60" fill="none" stroke="${R}" stroke-width="3"/>`;
        b += ribbon(166, 'ASSO DI SPADE');
      } else {
        b += g(batonArt, 52, 80, 1.08);
        b += `<path d="M10,146H94L90,154L94,162H10L14,154Z" fill="${P}" ${sw} stroke-width="1.2"/>`;
        b += `<text x="52" y="152.6" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="5.6" fill="${K}">AVERE UN BEL BASTON</text>`;
        b += `<text x="52" y="159.6" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="5.6" fill="${K}">IN MANE SEMPRE BON</text>`;
      }
      b += idx(1);
    } else {
      if (c.s === 2) b += swordPips(c.n);
      else if (c.s === 3) b += batonPips(c.n);
      else {
        const art = c.s === 1 ? coinArt : cupArt;
        const sc = c.n <= 3 ? 0.3 : 0.24;
        P2[c.n].forEach(([x, y]) => { b += g(art, x, y, sc); });
        if (c.s === 1 && c.n >= 4) b += sprig(52, 96, 0);
        if (c.s === 1 && c.n === 4) b += `<path d="M44,90L46,84L49,88L52,82L55,88L58,84L60,90Z" fill="${Y}" ${sw} stroke-width="1"/>`;
      }
      b += idx(c.n);
    }
    return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${b}</svg>`;
  }
  const back = () => `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
    <rect x="1" y="1" width="${W - 2}" height="${H - 2}" rx="7" fill="${P}" stroke="#9a9384" stroke-width="1.5"/>
    <rect x="6" y="6" width="${W - 12}" height="${H - 12}" rx="3" fill="url(#bkT)" stroke="#16244a" stroke-width="1.5"/>
    <rect x="${W / 2 - 18}" y="${H / 2 - 18}" width="36" height="36" transform="rotate(45 ${W / 2} ${H / 2})" fill="#1b2e5c" stroke="${P}" stroke-width="1.5"/>
    <circle cx="${W / 2}" cy="${H / 2}" r="7" fill="${P}"/></svg>`;
  const PATTERN = `<pattern id="bkT" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#1b2e5c"/><path d="M5,0L10,5L5,10L0,5Z" fill="none" stroke="#4d6fae" stroke-width=".9"/><circle cx="5" cy="5" r="1" fill="#8aa4d6"/></pattern>`;
  return { card, back, SUIT, PATTERN, W, H };
})();

<script>// ===================== MAĐARICE (William Tell pattern, redrawn) =====================
// 59 x 91 mm cards, double-headed, Roman numerals in both top corners (repeated upside down),
// two-tone suit signs, landscape vignettes on VII/VIII/X, king on horseback, seasons on the aces.
const Madjarice = (() => {
  const W = 118, H = 182, CX = 59;
  const K = '#1a1a1a', R = '#d8262b', Y = '#f4c51f', G = '#3f9a3a', BL = '#2a5aa8', BR = '#8a5a2b', P = '#fffdf6', SKIN = '#f6d7b8';
  const sw = 'stroke="#1a1a1a" stroke-linejoin="round"';

  const heart = `<path d="M0,42C-56,4 -44,-50 0,-22C44,-50 56,4 0,42Z" fill="${R}"/>
    <path d="M-4,-19C-18,-36 -38,-27 -36,-8C-34,4 -24,15 -11,24C-19,9 -19,-6 -4,-19Z" fill="${Y}"/>
    <path d="M0,42C-56,4 -44,-50 0,-22C44,-50 56,4 0,42Z" fill="none" ${sw} stroke-width="3.5"/>`;
  const bell = `<circle cy="-41" r="6" fill="none" ${sw} stroke-width="3.5"/>
    <path d="M-30,20C-32,-8 -22,-35 0,-35C22,-35 32,-8 30,20Z" fill="${Y}" ${sw} stroke-width="3.5"/>
    <path d="M-31.5,-1H31.5V9H-31.5Z" fill="${R}" ${sw} stroke-width="2"/>
    <path d="M-31,9H31L30,20H-30Z" fill="${G}" ${sw} stroke-width="2"/>
    <path d="M-12,-26C-4,-30 6,-30 12,-26" fill="none" stroke="#fff3b8" stroke-width="3" stroke-linecap="round"/>
    <path d="M0,-35V-1" stroke="${K}" stroke-width="2"/>
    <circle cy="28" r="7" fill="${Y}" ${sw} stroke-width="3"/>`;
  const leaf = `<path d="M0,-46C-34,-30 -40,10 -4,38L0,40Z" fill="${Y}"/>
    <path d="M0,-46C34,-30 40,10 4,38L0,40Z" fill="${G}"/>
    <path d="M0,-46C34,-30 40,10 4,38L2,48H-2L-4,38C-40,10 -34,-30 0,-46Z" fill="none" ${sw} stroke-width="3.5"/>
    <path d="M0,-40V40" stroke="${R}" stroke-width="3"/>
    <path d="M0,-18L-16,-28M0,-18L16,-28M0,2L-22,-10M0,2L22,-10M0,20L-16,10M0,20L16,10" stroke="${K}" stroke-width="1.6"/>`;
  const acorn = `<rect x="-3" y="-47" width="6" height="12" fill="${BR}" ${sw} stroke-width="2"/>
    <path d="M0,-8C-27,-8 -25,40 0,42Z" fill="${Y}"/><path d="M0,-8C27,-8 25,40 0,42Z" fill="${R}"/>
    <path d="M0,-8C-27,-8 -25,40 0,42C25,40 27,-8 0,-8Z" fill="none" ${sw} stroke-width="3.5"/>
    <path d="M-27,-6Q-27,-36 0,-37Q27,-36 27,-6Q0,4 -27,-6Z" fill="#7d8f2c" ${sw} stroke-width="3.5"/>
    <path d="M-18,-26L14,-4M-6,-33L22,-14M-22,-14L4,4M18,-30L-14,-2M6,-34L-22,-12M24,-18L0,4" stroke="#4d5a18" stroke-width="2"/>`;
  const SUIT = [heart, bell, leaf, acorn];
  const g = (art, x, y, sc, rot = 0) => `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${sc})">${art}</g>`;

  // small landscape vignette, drawn fully inside its rect
  function scene(x, y, w, h, kind = 'spring') {
    const sky = { spring: '#cfe6f5', summer: '#bfe0f7', autumn: '#f3dcb0', winter: '#dfe5ea' }[kind];
    const ground = { spring: '#7cc06a', summer: '#e9c84a', autumn: '#b88a3c', winter: '#ffffff' }[kind];
    const tree = { spring: '#f2a7b8', summer: '#3f9a3a', autumn: '#e0782c', winter: 'none' }[kind];
    const r = Math.min(8, h / 4);
    const x2 = x + w, y2 = y + h, hz = y + h * 0.58;
    return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${sky}" ${sw} stroke-width="1.2"/>
      <path d="M${x + 1},${hz}Q${x + w * 0.3},${hz - h * 0.18} ${x + w * 0.55},${hz}T${x2 - 1},${hz - h * 0.06}V${y2 - r}Q${x2 - 1},${y2 - 1} ${x2 - r},${y2 - 1}H${x + r}Q${x + 1},${y2 - 1} ${x + 1},${y2 - r}Z" fill="${ground}" stroke="${K}" stroke-width=".8"/>
      <rect x="${x + w * 0.62}" y="${hz - h * 0.2}" width="${w * 0.14}" height="${h * 0.16}" fill="#fff6e0" stroke="${K}" stroke-width=".8"/>
      <path d="M${x + w * 0.6},${hz - h * 0.2}L${x + w * 0.69},${hz - h * 0.34}L${x + w * 0.78},${hz - h * 0.2}Z" fill="${R}" stroke="${K}" stroke-width=".8"/>
      <rect x="${x + w * 0.24}" y="${hz - h * 0.24}" width="${w * 0.03}" height="${h * 0.26}" fill="${BR}"/>
      ${tree === 'none' ? `<path d="M${x + w * 0.255},${hz - h * 0.2}l-${w * 0.06},-${h * 0.14}M${x + w * 0.255},${hz - h * 0.14}l${w * 0.07},-${h * 0.12}" stroke="${BR}" stroke-width="1.2"/>` : `<circle cx="${x + w * 0.255}" cy="${hz - h * 0.3}" r="${Math.min(w, h) * 0.16}" fill="${tree}" stroke="${K}" stroke-width=".8"/>`}
      ${kind === 'summer' ? `<circle cx="${x + w * 0.85}" cy="${y + h * 0.22}" r="${h * 0.1}" fill="${Y}" stroke="${K}" stroke-width=".8"/>` : ''}`;
  }

  // ---- pips ----
  const COLS = [35, 83];
  function layout(n) {
    const sideY = [28, 54, 128, 154];
    const pts = [];
    if (n >= 8) COLS.forEach(x => sideY.forEach(y => pts.push([x, y])));
    if (n === 10) pts.push([CX, 41], [CX, 141]);
    if (n === 9) pts.push([CX, 91]);
    if (n === 7) { COLS.forEach(x => [28, 54].forEach(y => pts.push([x, y]))); pts.push([35, 154], [83, 154], [CX, 134]); }
    return pts;
  }
  function pips(c) {
    const n = +c.r, art = SUIT[c.s], pts = layout(n);
    let out = '';
    if (n === 8 || n === 7) out += scene(14, 74, 90, 34, ['spring', 'summer', 'autumn', 'winter'][c.s]);
    if (n === 10) out += scene(38, 78, 42, 26, ['spring', 'summer', 'autumn', 'winter'][c.s]);
    if (c.s >= 2) {
      // leaves and acorns grow on a red vine
      const segs = pts.map(([x, y]) => `M${CX},${y < 91 ? y + 8 : y - 8}L${x},${y}`).join('');
      out += `<path d="M${CX},20V${n === 8 || n === 7 ? 72 : 162}${n === 8 || n === 7 ? `M${CX},110V162` : ''}${segs}" stroke="${R}" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
    }
    pts.forEach(([x, y]) => { out += g(art, x, y, 0.23, y > 91 ? 180 : 0); });
    return out;
  }

  // ---- court figures (top half, y 6..91, mirrored) ----
  const COURT_COL = [[R, G], [G, R], [BL, Y], [BR, R]];
  function face(cx, cy, beard) {
    return `<ellipse cx="${cx}" cy="${cy}" rx="9.5" ry="11.5" fill="${SKIN}" ${sw} stroke-width="1.6"/>
      <path d="M${cx - 5},${cy - 2}h3.5M${cx + 1.5},${cy - 2}h3.5" stroke="${K}" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M${cx},${cy - 1}l-1.6,5h2.6" fill="none" stroke="${K}" stroke-width="1"/>
      <path d="M${cx - 3},${cy + 7}q3,1.6 6,0" fill="none" stroke="${R}" stroke-width="1.3" stroke-linecap="round"/>
      ${beard ? `<path d="M${cx - 9},${cy + 3}Q${cx - 8},${cy + 18} ${cx},${cy + 20}Q${cx + 8},${cy + 18} ${cx + 9},${cy + 3}Q${cx + 5},${cy + 10} ${cx},${cy + 10}Q${cx - 5},${cy + 10} ${cx - 9},${cy + 3}Z" fill="#8c6a4a" ${sw} stroke-width="1.2"/>` : `<path d="M${cx - 9.5},${cy - 2}q-2,10 1,14M${cx + 9.5},${cy - 2}q2,10 -1,14" stroke="#7a4a24" stroke-width="3" fill="none"/>`}`;
  }
  function hatFeather(cx, cy, col) {
    return `<path d="M${cx - 16},${cy - 8}Q${cx - 14},${cy - 22} ${cx},${cy - 22}Q${cx + 16},${cy - 22} ${cx + 18},${cy - 8}Q${cx},${cy - 13} ${cx - 16},${cy - 8}Z" fill="${col}" ${sw} stroke-width="1.6"/>
      <path d="M${cx + 10},${cy - 18}C${cx + 22},${cy - 30} ${cx + 30},${cy - 26} ${cx + 36},${cy - 32}C${cx + 32},${cy - 20} ${cx + 22},${cy - 14} ${cx + 12},${cy - 14}Z" fill="#fff" ${sw} stroke-width="1.2"/>`;
  }
  function courtTop(c) {
    const [m, s2] = COURT_COL[c.s], sym = SUIT[c.s];
    if (c.r === 'K') return `
      <path d="M8,91C8,72 12,58 24,52C25,44 30,38 36,40L40,50C36,54 34,60 36,68C38,76 40,84 41,91Z" fill="#f4ecd8" ${sw} stroke-width="1.8"/>
      <path d="M24,52C20,46 14,44 10,46C8,52 10,58 16,60C20,60 23,57 24,52Z" fill="#f4ecd8" ${sw} stroke-width="1.6"/>
      <circle cx="15" cy="51" r="1.6" fill="${K}"/>
      <path d="M36,40C42,46 44,56 42,66C44,74 44,82 46,91" fill="none" stroke="${R}" stroke-width="5"/>
      <path d="M12,55L24,54L32,46" fill="none" stroke="${BR}" stroke-width="2"/>
      <path d="M44,91L48,62Q66,52 86,60L96,91Z" fill="${m}" ${sw} stroke-width="1.8"/>
      <path d="M52,62Q70,72 88,62L86,56Q70,66 54,56Z" fill="#fff" ${sw} stroke-width="1.3"/>
      ${face(70, 40, true)}
      <path d="M58,32L55,16L63,24L70,12L77,24L85,16L82,32Z" fill="${Y}" ${sw} stroke-width="1.6"/>
      <rect x="57" y="28" width="26" height="6" fill="${R}" ${sw} stroke-width="1.4"/>
      ${g(sym, 104, 18, 0.16)}`;
    const isU = c.r === 'U';
    return `
      <path d="M16,91L22,62Q40,52 59,54Q78,52 96,62L102,91Z" fill="${m}" ${sw} stroke-width="1.8"/>
      <path d="M44,91L46,60Q59,64 72,60L74,91Z" fill="${s2}" ${sw} stroke-width="1.5"/>
      <path d="M46,72H72M46,82H74" stroke="${Y}" stroke-width="2.2"/>
      <path d="M42,58Q59,68 76,58L74,52Q59,62 44,52Z" fill="#fff" ${sw} stroke-width="1.3"/>
      ${face(59, 38, !isU)}
      ${hatFeather(59, 34, s2)}
      ${isU
        ? `<ellipse cx="88" cy="80" rx="5" ry="4" fill="${SKIN}" ${sw} stroke-width="1.2"/>${g(sym, 16, 78, 0.18)}`
        : `<ellipse cx="94" cy="58" rx="5" ry="4" fill="${SKIN}" ${sw} stroke-width="1.2"/>${g(sym, 16, 18, 0.18)}`}`;
  }

  const SEASON = { hr: ['PROLJEĆE', 'LJETO', 'JESEN', 'ZIMA'], en: ['SPRING', 'SUMMER', 'AUTUMN', 'WINTER'] };
  const SEASON_KIND = ['spring', 'summer', 'autumn', 'winter'];
  const ROMAN = { '7': 'VII', '8': 'VIII', '9': 'IX', '10': 'X' };

  function card(c, lang = 'hr') {
    let b = `<rect x="1" y="1" width="${W - 2}" height="${H - 2}" rx="7" fill="${P}" stroke="#9a9384" stroke-width="1.5"/>`;
    if (ROMAN[c.r]) {
      b += pips(c);
      const t = ROMAN[c.r];
      const ix = `<text x="9" y="16" class="ixr" fill="${K}">${t}</text><text x="${W - 9}" y="16" class="ixr" text-anchor="end" fill="${K}">${t}</text>`;
      b += ix + `<g transform="rotate(180 ${W / 2} ${H / 2})">${ix}</g>`;
    } else if (c.r === 'A') {
      const top = `${scene(8, 8, W - 16, 74, SEASON_KIND[c.s])}`;
      b += top + `<g transform="rotate(180 ${W / 2} ${H / 2})">${top}</g>`;
      b += g(SUIT[c.s], CX, 91, 0.3);
      b += `<path d="M6,84H112L108,91L112,98H6L10,91Z" fill="${P}" ${sw} stroke-width="1.2" opacity=".0"/>`;
      b += `<rect x="6" y="84" width="22" height="14" rx="3" fill="${P}" ${sw} stroke-width="1"/><rect x="${W - 28}" y="84" width="22" height="14" rx="3" fill="${P}" ${sw} stroke-width="1"/>`;
      b += `<text x="17" y="94" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="7" fill="${K}">A</text><text x="${W - 17}" y="94" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="7" fill="${K}">A</text>`;
      b += `<text x="${CX}" y="20" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="7.5" letter-spacing=".6" fill="${K}">${SEASON[lang][c.s]}</text>`;
      b += `<text x="${CX}" y="20" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="7.5" letter-spacing=".6" fill="${K}" transform="rotate(180 ${W / 2} ${H / 2})">${SEASON[lang][c.s]}</text>`;
    } else {
      const top = courtTop(c);
      b += `<rect x="5" y="5" width="${W - 10}" height="${H - 10}" rx="4" fill="none" stroke="${K}" stroke-width="1.2"/>`;
      b += `<g>${top}</g><g transform="rotate(180 ${W / 2} ${H / 2})">${top}</g>`;
      b += `<path d="M5,91H${W - 5}" stroke="${K}" stroke-width="1.2"/>`;
    }
    return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${b}</svg>`;
  }
  const back = () => `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
    <rect x="1" y="1" width="${W - 2}" height="${H - 2}" rx="7" fill="${P}" stroke="#9a9384" stroke-width="1.5"/>
    <rect x="6" y="6" width="${W - 12}" height="${H - 12}" rx="4" fill="url(#bkH)" stroke="#4a120e" stroke-width="1.5"/>
    <rect x="${W / 2 - 20}" y="${H / 2 - 20}" width="40" height="40" rx="4" transform="rotate(45 ${W / 2} ${H / 2})" fill="#8e2a24" stroke="#e8d7a8" stroke-width="1.5"/>
    ${g(heart, W / 2, H / 2, 0.2)}</svg>`;
  return { card, back, SUIT, W, H };
})();
</script>
<script>// ===================== CARD ART (original SVG drawings) =====================
const Cards = (() => {
  const INK = '#2a1d14', RED = '#c4382b', GOLD = '#e2a92f', BLUE = '#3c6aa0', GREEN = '#4a8a3c', SKIN = '#f1c9a0', PAPER = '#fbf6ea';
  // ---- suit symbols in a 100x100 box centred on 0,0 ----
  const T_SUIT = [
    // 0 Kupe (cups)
    `<path d="M-34,-36H34C34,-6 18,10 0,12C-18,10 -34,-6 -34,-36Z" fill="${GOLD}" stroke="${INK}" stroke-width="3.5"/>
     <ellipse cx="0" cy="-36" rx="34" ry="7" fill="${RED}" stroke="${INK}" stroke-width="3.5"/>
     <path d="M-22,-20H22" stroke="${RED}" stroke-width="5"/>
     <rect x="-5" y="11" width="10" height="20" fill="${BLUE}" stroke="${INK}" stroke-width="3"/>
     <ellipse cx="0" cy="22" rx="10" ry="5" fill="${GOLD}" stroke="${INK}" stroke-width="3"/>
     <path d="M-26,44Q0,26 26,44Z" fill="${GOLD}" stroke="${INK}" stroke-width="3.5"/>`,
    // 1 Dinari (coins)
    `<circle r="44" fill="${GOLD}" stroke="${INK}" stroke-width="4"/>
     <circle r="33" fill="none" stroke="${INK}" stroke-width="2.5"/>
     ${[0, 45, 90, 135].map(a => `<ellipse rx="6" ry="27" transform="rotate(${a})" fill="${RED}" stroke="${INK}" stroke-width="1.6"/>`).join('')}
     <circle r="9" fill="${GREEN}" stroke="${INK}" stroke-width="2.5"/>`,
    // 2 Špade (swords) - curved sabre
    `<path d="M-3,-48Q18,-8 4,30L-6,30Q6,-8 -11,-44Z" fill="#c9d6e2" stroke="${INK}" stroke-width="3"/>
     <path d="M-3,-40Q12,-8 0,26" fill="none" stroke="${BLUE}" stroke-width="2"/>
     <path d="M-22,29H20Q22,36 14,36H-16Q-24,36 -22,29Z" fill="${GOLD}" stroke="${INK}" stroke-width="3"/>
     <rect x="-5" y="36" width="10" height="10" fill="${RED}" stroke="${INK}" stroke-width="2.5"/>
     <circle cx="0" cy="50" r="5" fill="${GOLD}" stroke="${INK}" stroke-width="2.5"/>`,
    // 3 Baštoni (clubs) - knotted baton
    `<path d="M-7,46L-12,-34Q0,-52 12,-34L7,46Q0,50 -7,46Z" fill="#6f9a3e" stroke="${INK}" stroke-width="3.5"/>
     <path d="M-11,-22l-9,-6M11,-6l9,-6M-10,10l-9,-5M9,24l8,-5" stroke="${INK}" stroke-width="5" stroke-linecap="round"/>
     <path d="M-11,-22l-9,-6M11,-6l9,-6M-10,10l-9,-5M9,24l8,-5" stroke="#9cc06a" stroke-width="2" stroke-linecap="round"/>
     <path d="M-9,34H9" stroke="${RED}" stroke-width="5"/>`
  ];
  const H_SUIT = [
    // 0 Herc (hearts)
    `<path d="M0,40C-58,2 -42,-50 0,-22C42,-50 58,2 0,40Z" fill="${RED}" stroke="${INK}" stroke-width="3.5"/>
     <path d="M-24,-22Q-30,-6 -14,6" fill="none" stroke="#f08a74" stroke-width="4" stroke-linecap="round"/>`,
    // 1 Bundeva / zvono (bells)
    `<circle cx="0" cy="-40" r="6" fill="none" stroke="${INK}" stroke-width="3.5"/>
     <path d="M-30,22C-32,-8 -22,-34 0,-34C22,-34 32,-8 30,22Z" fill="${GOLD}" stroke="${INK}" stroke-width="3.5"/>
     <rect x="-30" y="2" width="60" height="9" fill="${RED}" stroke="${INK}" stroke-width="2.5"/>
     <path d="M-30,22H30" stroke="${INK}" stroke-width="3.5"/>
     <path d="M-14,-18Q0,-24 14,-18" fill="none" stroke="#fbe28f" stroke-width="3" stroke-linecap="round"/>
     <circle cx="0" cy="31" r="7" fill="${GOLD}" stroke="${INK}" stroke-width="3"/>`,
    // 2 Zeleni / list (leaves)
    `<path d="M0,-46C36,-30 42,10 4,38L2,48H-2L-4,38C-42,10 -36,-30 0,-46Z" fill="${GREEN}" stroke="${INK}" stroke-width="3.5"/>
     <path d="M0,-38V38M0,-14L-18,-26M0,-14L18,-26M0,6L-22,-8M0,6L22,-8M0,24L-16,14M0,24L16,14" stroke="#b8dc8e" stroke-width="2.2" fill="none"/>`,
    // 3 Žir (acorns)
    `<rect x="-3" y="-46" width="6" height="12" fill="#6b4220" stroke="${INK}" stroke-width="2"/>
     <ellipse cx="0" cy="12" rx="20" ry="28" fill="${GOLD}" stroke="${INK}" stroke-width="3.5"/>
     <path d="M-27,-6Q-27,-36 0,-37Q27,-36 27,-6Q0,4 -27,-6Z" fill="#8a5a28" stroke="${INK}" stroke-width="3.5"/>
     <path d="M-18,-26L14,-4M-6,-33L22,-14M-22,-14L4,4M18,-30L-14,-2M6,-34L-22,-12M24,-18L0,4" stroke="#5a3a18" stroke-width="2"/>
     <path d="M-8,18Q-6,30 4,34" fill="none" stroke="#fbe28f" stroke-width="3" stroke-linecap="round"/>`
  ];
  const sym = (art, x, y, sc, rot = 0) => `<g transform="translate(${x},${y}) rotate(${rot}) scale(${sc})">${art}</g>`;

  const W = 120, Hh = 190;
  const frame = (fill, stroke) => `<rect x="1.5" y="1.5" width="${W - 3}" height="${Hh - 3}" rx="9" fill="${fill}" stroke="${stroke}" stroke-width="2"/>`;
  const PIPS = {
    1: [[60, 95]], 2: [[60, 52], [60, 138]], 3: [[60, 45], [60, 95], [60, 145]],
    4: [[38, 55], [82, 55], [38, 135], [82, 135]], 5: [[38, 52], [82, 52], [60, 95], [38, 138], [82, 138]],
    6: [[38, 45], [82, 45], [38, 95], [82, 95], [38, 145], [82, 145]],
    7: [[38, 40], [82, 40], [60, 70], [38, 100], [82, 100], [38, 150], [82, 150]],
    8: [[38, 40], [82, 40], [38, 78], [82, 78], [38, 116], [82, 116], [38, 154], [82, 154]],
    9: [[38, 40], [82, 40], [38, 75], [82, 75], [60, 97], [38, 120], [82, 120], [38, 154], [82, 154]],
    10: [[38, 38], [82, 38], [60, 58], [38, 80], [82, 80], [38, 112], [82, 112], [60, 134], [38, 154], [82, 154]]
  };
  const IT_SUIT = ['COPPE', 'DENARI', 'SPADE', 'BASTONI'];
  const IT_COURT = { F: 'FANTE', C: 'CAVALLO', K: 'RE' };
  const SUIT_COL = [RED, GOLD, BLUE, GREEN];

  // a small stylised figure, drawn in the top half (y 12..88), mirrored for double-headed cards
  function figure(rank, col, suitArt, hung) {
    let hat = '';
    if (rank === 'K') hat = `<path d="M44,24L47,10L54,19L60,7L66,19L73,10L76,24Z" fill="${GOLD}" stroke="${INK}" stroke-width="2"/>`;
    else if (rank === 'C' || rank === 'O') hat = `<path d="M44,25Q60,8 76,25Z" fill="${col}" stroke="${INK}" stroke-width="2"/><path d="M70,14Q86,4 88,18" fill="none" stroke="${RED}" stroke-width="3"/>`;
    else hat = `<path d="M45,25Q48,13 60,13Q74,13 78,22L72,25Z" fill="${col}" stroke="${INK}" stroke-width="2"/>`;
    const horse = rank === 'C' ? `<path d="M14,86Q10,58 26,48Q30,40 38,44L36,52Q30,58 32,70L30,86Z" fill="#b07a46" stroke="${INK}" stroke-width="2"/><circle cx="31" cy="49" r="1.6" fill="${INK}"/>` : '';
    return `${horse}
      <path d="M38,88L42,48Q60,40 78,48L82,88Z" fill="${col}" stroke="${INK}" stroke-width="2.2"/>
      <path d="M42,62H78M60,46V88" stroke="${PAPER}" stroke-width="2" opacity=".7"/>
      <path d="M48,46Q60,54 72,46" fill="${PAPER}" stroke="${INK}" stroke-width="1.8"/>
      <circle cx="60" cy="33" r="10" fill="${SKIN}" stroke="${INK}" stroke-width="2"/>
      <path d="M55,36Q60,40 65,36" fill="none" stroke="${INK}" stroke-width="1.4"/>
      <circle cx="56.5" cy="31" r="1.2" fill="${INK}"/><circle cx="63.5" cy="31" r="1.2" fill="${INK}"/>
      ${hat}
      ${sym(suitArt, hung ? 26 : 92, hung ? 66 : 64, 0.2)}`;
  }

  function triestine(c) {
    const col = SUIT_COL[c.s], art = T_SUIT[c.s];
    let body = frame(PAPER, '#8b7a5c');
    body += `<rect x="7" y="7" width="${W - 14}" height="${Hh - 14}" rx="5" fill="none" stroke="${col}" stroke-width="1.2" opacity=".55"/>`;
    const idx = (n) => `<text x="13" y="24" class="ix" fill="${INK}">${n}</text><text x="${W - 13}" y="${Hh - 12}" class="ix" fill="${INK}" transform="rotate(180 ${W - 13} ${Hh - 18})">${n}</text>`;
    if (['F', 'C', 'K'].includes(c.r)) {
      const top = figure(c.r, col, art, false);
      body += `<g>${top}</g><g transform="rotate(180 60 95)">${top}</g>`;
      body += `<rect x="12" y="86" width="96" height="18" fill="${PAPER}" stroke="${INK}" stroke-width="1.5"/>
               <text x="60" y="98.5" class="lbl" fill="${INK}">${IT_COURT[c.r]} DI ${IT_SUIT[c.s]}</text>`;
      body += idx(c.n);
    } else {
      const n = c.n;
      if (n === 1) {
        body += `<circle cx="60" cy="95" r="44" fill="${col}" opacity=".12"/>`;
        body += sym(art, 60, 95, 0.78);
        body += `<path d="M24,160Q60,148 96,160" fill="none" stroke="${col}" stroke-width="2"/>`;
      } else {
        const sc = c.s >= 2 ? 0.34 : 0.27;
        PIPS[n].forEach(([x, y]) => { body += sym(art, x, y, sc, (c.s >= 2 && y > 95) ? 180 : 0); });
      }
      body += idx(n);
    }
    return `<svg viewBox="0 0 ${W} ${Hh}" xmlns="http://www.w3.org/2000/svg">${body}</svg>`;
  }

  const ROMAN = { '7': 'VII', '8': 'VIII', '9': 'IX', '10': 'X' };
  const SEASON = { hr: ['PROLJEĆE', 'ZIMA', 'LJETO', 'JESEN'], en: ['SPRING', 'WINTER', 'SUMMER', 'AUTUMN'] };
  function madjarice(c, lang) {
    const col = ['#c4382b', '#c98a1c', '#3f7f36', '#8a5a28'][c.s];
    const art = H_SUIT[c.s];
    let body = frame('#fffaf0', '#6f6250');
    body += `<rect x="6" y="6" width="${W - 12}" height="${Hh - 12}" rx="6" fill="none" stroke="${INK}" stroke-width="1.2"/>`;
    if (ROMAN[c.r]) {
      PIPS[+c.r].forEach(([x, y]) => { body += sym(art, x, y, 0.25); });
      body += `<text x="14" y="22" class="ixr" fill="${INK}">${ROMAN[c.r]}</text><text x="${W - 14}" y="22" class="ixr" fill="${INK}" text-anchor="end">${ROMAN[c.r]}</text>`;
    } else if (c.r === 'A') {
      body += `<rect x="14" y="20" width="92" height="118" rx="6" fill="${col}" opacity=".1"/>`;
      body += sym(art, 60, 76, 0.72);
      body += `<path d="M20,146H100L94,158H26Z" fill="${col}" stroke="${INK}" stroke-width="1.5"/>`;
      body += `<text x="60" y="155" class="lbl" fill="#fff">${SEASON[lang][c.s]}</text>`;
      body += sym(art, 22, 172, 0.15) + sym(art, 98, 172, 0.15);
    } else {
      // single-figure court: Ober has its suit sign high, Unter low (as on real William Tell cards)
      const isU = c.r === 'U';
      body += `<rect x="12" y="12" width="96" height="166" rx="4" fill="${col}" opacity=".08"/>`;
      body += `<g transform="translate(0,22) scale(1,1.6) translate(0,-8)">${figure(c.r === 'K' ? 'K' : c.r === 'O' ? 'O' : 'F', col, '', false)}</g>`;
      body += `<path d="M44,160H76" stroke="${INK}" stroke-width="2"/><path d="M47,148V160M73,148V160" stroke="${INK}" stroke-width="5" stroke-linecap="round"/>`;
      body += sym(art, isU ? 26 : 24, isU ? 128 : 28, 0.22);
      body += `<text x="${W - 14}" y="${Hh - 12}" class="ixr" fill="${INK}" text-anchor="end">${c.r === 'U' ? 'U' : c.r === 'O' ? 'O' : 'K'}</text>`;
    }
    return `<svg viewBox="0 0 ${W} ${Hh}" xmlns="http://www.w3.org/2000/svg">${body}</svg>`;
  }

  function back(deck) {
    if (deck === 'b') return `<svg viewBox="0 0 ${W} ${Hh}" xmlns="http://www.w3.org/2000/svg">${frame('#24477a', '#0f2240')}
      <rect x="8" y="8" width="${W - 16}" height="${Hh - 16}" rx="5" fill="url(#bkT)" stroke="#d9b45a" stroke-width="1.5"/>
      <circle cx="60" cy="95" r="16" fill="#24477a" stroke="#d9b45a" stroke-width="1.5"/><circle cx="60" cy="95" r="7" fill="#d9b45a"/></svg>`;
    return `<svg viewBox="0 0 ${W} ${Hh}" xmlns="http://www.w3.org/2000/svg">${frame('#8e2a24', '#4a120e')}
      <rect x="8" y="8" width="${W - 16}" height="${Hh - 16}" rx="5" fill="url(#bkH)" stroke="#e8d7a8" stroke-width="1.5"/>
      <rect x="40" y="75" width="40" height="40" rx="4" transform="rotate(45 60 95)" fill="#8e2a24" stroke="#e8d7a8" stroke-width="1.5"/></svg>`;
  }
  const DEFS = `<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <pattern id="bkT" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#24477a"/><path d="M6,0L12,6L6,12L0,6Z" fill="none" stroke="#5d84bd" stroke-width="1"/></pattern>
    <pattern id="bkH" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#8e2a24"/><rect width="5" height="10" fill="#7a221d"/><circle cx="5" cy="5" r="1.4" fill="#3f7d3a"/></pattern>
  </defs></svg>`;
  const suitIcon = (game, s, size = 18) => `<svg viewBox="-50 -50 100 100" width="${size}" height="${size}" aria-hidden="true">${(game === 'b' ? Triestine.SUIT : Madjarice.SUIT)[s]}</svg>`;
  const DEFS2 = DEFS.replace(/<pattern id="bkT"[\s\S]*?<\/pattern>/, Triestine.PATTERN);
  return {
    triestine: c => Triestine.card(c),
    madjarice: (c, lang) => Madjarice.card(c, lang),
    back: deck => deck === 'b' ? Triestine.back() : Madjarice.back(),
    DEFS: DEFS2, suitIcon,
    ratio: game => game === 'b' ? Triestine.H / Triestine.W : Madjarice.H / Madjarice.W
  };
})();
</script>

  const dx = { 0: 9, 1: -4, 2: -9, 3: 4 }[seat], dy = { 0: -6, 1: 9, 2: 6, 3: -9 }[seat];
  return { x: x + dx, y: y + dy, r: 9 - seat * 5 };

  const cards = G.hands[0].slice();
  const showTalon = G.game === 'h' && G.phase === 'bid';
  const order = G.game === 'b' ? [1, 0, 2, 3] : [0, 1, 2, 3];
  const tr = G.trump;
  cards.sort((a, b) => {
    const sa = (a.s === tr ? 9 : order[a.s]), sb = (b.s === tr ? 9 : order[b.s]);
    if (sa !== sb) return sa - sb;
    return G.game === 'b' ? b.st - a.st : E.hStr(b, tr) - E.hStr(a, tr);
  });
  const n = cards.length + (showTalon ? 2 : 0);
  const W = el.clientWidth || 360;
  const cw = Math.min(96, W / (1 + Math.max(0, n - 1) * 0.58));
  const step = n > 1 ? Math.min(cw * 1.04, (W - cw) / (n - 1)) : 0;
  const total = cw + step * (n - 1);
  const x0 = (W - total) / 2;
  el.style.setProperty('--cw', cw + 'px');
  el.style.height = (cw * Cards.ratio(G.game) + 6) + 'px';
  const legal = pending ? pending.legal : null;
  el.classList.toggle('live', !!pending);
  let html = cards.map((c, i) => {
    const off = legal && !legal.has(c.id);
    return `<button class="hc${off ? ' off' : ''}${sel === c.id ? ' sel' : ''}" data-id="${c.id}" style="left:${x0 + i * step}px" aria-label="${c.id}" ${off ? 'aria-disabled="true"' : ''}>${face(G.game, c)}</button>`;
  }).join('');
  if (showTalon) for (let i = 0; i < 2; i++) html += `<div class="hc talon" style="left:${x0 + (cards.length + i) * step}px">${Cards.back('h')}</div>`;
  el.innerHTML = html;
}
function renderAll() { renderBar(); renderSeats(); renderStock(); renderHand(); }
function setAction(html) { $('#action').innerHTML = html; }
function status(text, muted) { setAction(`<div class="msg">${muted ? `<span class="m">${text}</span>` : text}</div>`); }

function bubble(seat, html, gold, ms = 1700) {
  const pos = { 0: [50, 84], 1: [78, 38], 2: [50, 25], 3: [22, 38] }[seat];
  const b = document.createElement('div');
  b.className = 'bubble' + (gold ? ' gold' : '');
  b.style.left = pos[0] + '%'; b.style.top = pos[1] + '%';
  b.innerHTML = html;
  felt().appendChild(b);
  setTimeout(() => b.remove(), ms);
}

// trick cards on the felt
function placeTrickCard(seat, card) {
  const nth = G.trick.filter(t => t.seat === seat).length - 1;
  const p = slotFor(seat, nth);
  const el = document.createElement('div');
  el.className = 'tc svgc'; el.dataset.id = card.id;
  el.style.left = p.x + '%'; el.style.top = p.y + '%'; el.style.setProperty('--r', p.r + 'deg');
  el.style.zIndex = G.trick.length;
  el.innerHTML = face(G.game, card);
  $('#center').appendChild(el);
  const o = ORIGIN[seat];
  el.animate([{ left: o[0] + '%', top: o[1] + '%', opacity: .3 }, { left: p.x + '%', top: p.y + '%', opacity: 1 }], { duration: 260, easing: 'cubic-bezier(.2,.8,.3,1)' });
}
async function collectTrick(winner) {
  const o = ORIGIN[winner];
  const els = [...$('#center').children];
  els.forEach(el => el.animate([{ opacity: 1 }, { left: o[0] + '%', top: o[1] + '%', opacity: 0 }], { duration: 360, easing: 'ease-in', fill: 'forwards' }));
  await sleep(370);
  $('#center').innerHTML = '';
}

// human input
function humanPick(legalIds) {
  return new Promise(res => { pending = { legal: new Set(legalIds), res }; sel = null; renderHand(); });
}
$('#hand').addEventListener('click', e => {
  const b = e.target.closest('.hc'); if (!b || !pending || !b.dataset.id) return;
  const id = b.dataset.id;
  if (!pending.legal.has(id)) return;
  if (S.tap === 2 && sel !== id) { sel = id; renderHand(); status(L().tapAgain); return; }
  const card = G.hands[0].find(c => c.id === id);
  const p = pending; pending = null; sel = null;
  p.res(card);
});
$('#center').addEventListener('click', () => { });

// ================= GAME START =================
function startGame(game) {
  token++; pending = null; sel = null; closeSheet();
  if (game === 'b') { G = E.bNew({ players: S.bPlayers, double: S.bDouble, target: S.bTarget, reveal: S.bPlayers === 4 && S.bReveal }); }
  else { G = E.hNew({ target: S.hTarget }); }
  G.turn = null;
  $('#home').hidden = true; $('#table').hidden = false;
  $('#center').innerHTML = '';
  const my = token;
  requestAnimationFrame(() => { layoutSizes(); });
  (game === 'b' ? briskulaMatch(my) : belaMatch(my)).catch(e => { if (!(e instanceof Abort)) { console.error(e); } });
}

async function turnTo(seat) {
  G.turn = seat; renderSeats();
  if (seat === 0) status(L().yourTurn);
  else status(L().thinking(esc(name(seat))), true);
}

// ================= BRIŠKULA =================
async function briskulaMatch(my) {
  const t = () => L();
  while (true) {
    G.dealer = E.nextSeat(G, G.dealer);
    E.bDeal(G); G.turn = null;
    $('#center').innerHTML = '';
    renderAll(); status('');
    await sleep(SPEED().deal); check(my);
    while (!E.bHandOver(G)) {
      const s = E.bToPlay(G);
      await turnTo(s);
      let card;
      if (s === 0) card = await humanPick(G.hands[0].map(c => c.id));
      else { await sleep(SPEED().ai); card = E.bAI(G, s); }
      check(my);
      const done = E.bPlay(G, s, card);
      placeTrickCard(s, card); renderSeats(); renderHand();
      if (done) {
        G.turn = null; renderSeats(); status('');
        await sleep(SPEED().trick); check(my);
        const { winner } = E.bFinishTrick(G);
        await collectTrick(winner); check(my);
        renderAll();
      }
    }
    G.turn = null; renderSeats();
    const pts = E.bPoints(G);
    let verdict;
    if (pts[0] > 60) { G.wins[0]++; verdict = t().handWon; }
    else if (pts[1] > 60) { G.wins[1]++; verdict = t().handLost; }
    else verdict = t().handDraw;
    G.history.push(pts);
    renderBar();
    const over = G.wins[0] >= G.opts.target || G.wins[1] >= G.opts.target;
    const marks = w => '|'.repeat(w) || '–';
    const head = over ? (G.wins[0] > G.wins[1] ? t().matchWon : t().matchLost) : verdict;
    const go = await waitSheet(`<h3>${head}</h3>
      <div class="big"><div>${pts[0]}<small>${t().we}</small></div><span class="sep">:</span><div>${pts[1]}<small>${t().they}</small></div></div>
      ${over ? `<p class="verdict">${verdict}</p>` : ''}
      <div class="tally"><div><span class="muted">${t().we}</span><b class="marks">${marks(G.wins[0])}</b></div><div><span class="muted">${t().matchTo}</span><b>${G.opts.target}</b></div><div><span class="muted">${t().they}</span><b class="marks">${marks(G.wins[1])}</b></div></div>
      <div class="btns">${over ? `<button class="sec" data-go="home">${t().home}</button><button class="pri" data-go="again">${t().again}</button>` : `<button class="pri" data-go="next">${t().next}</button>`}</div>`);
    check(my);
    if (go === 'home') return showHome();
    if (go === 'again') return startGame('b');
  }
}

// ================= BELA =================
async function belaMatch(my) {
  const t = () => L();
  while (true) {
    G.dealer = E.nextSeat(G, G.dealer);
    E.hDeal(G); G.phase = 'bid'; G.turn = null;
    $('#center').innerHTML = '';
    renderAll(); status('');
    await sleep(SPEED().deal); check(my);
    // ---- bidding ----
    let calledSuit = -1;
    while (calledSuit < 0) {
      const s = G.bidder; G.turn = s; renderSeats();
      let b;
      if (s === 0) b = await humanBid(s === G.dealer);
      else { status(t().bidWait(esc(name(s))), true); await sleep(SPEED().ai); b = E.hAIBid(G, s); }
      check(my);
      if (b < 0) { bubble(s, t().pass); E.hBid(G, s, -1); }
      else { calledSuit = b; bubble(s, `${Cards.suitIcon('h', b, 18)}${t().called(suitName('h', b))}`, true, 2000); E.hBid(G, s, b); }
      if (calledSuit < 0) await sleep(SPEED().ai * 0.4);
    }
    G.phase = 'play'; G.turn = null;
    renderAll();
    status(t().calls(esc(name(G.caller)), `<b>${suitName('h', G.trump)}</b>`));
    await sleep(SPEED().trick); check(my);
    // ---- declarations ----
    const D = G.decls;
    if (D.belotSeat !== null) {
      const w = D.belotSeat % 2;
      bubble(D.belotSeat, t().belot, true, 3000);
      G.score[w] = Math.max(G.score[w], G.opts.target);
      renderBar();
      await sleep(1400);
      const go = await waitSheet(`<h3>${w === 0 ? t().matchWon : t().matchLost}</h3><p>${t().belotWin(esc(name(D.belotSeat)))}</p>
        <div class="btns"><button class="sec" data-go="home">${t().home}</button><button class="pri" data-go="again">${t().again}</button></div>`);
      if (go === 'home') return showHome(); return startGame('h');
    }
    let any = false;
    for (const s of D.order) {
      const ds = D.per[s]; if (!ds.length) continue;
      any = true;
      bubble(s, `${t().declWord} ${ds.map(d => d.val).join(' + ')}`, false, 2400);
      await sleep(SPEED().ai * 0.6);
    }
    if (any) {
      status(D.team >= 0 ? t().declWin(D.team === team(0) ? t().we : t().they, D.total) : t().declNone);
      await sleep(SPEED().trick * 1.2); check(my);
    }
    // ---- tricks ----
    while (!E.hHandOver(G)) {
      const s = E.hToPlay(G);
      await turnTo(s);
      let card;
      if (s === 0) card = await humanPick(E.hLegal(G, 0).map(c => c.id));
      else { await sleep(SPEED().ai); card = E.hAI(G, s); }
      check(my);
      const r = E.hPlay(G, s, card);
      placeTrickCard(s, card); renderSeats(); renderHand();
      if (r.bela) bubble(s, t().belaCall, true);
      if (r.done) {
        G.turn = null; renderSeats(); status('');
        await sleep(SPEED().trick); check(my);
        const { winner } = E.hFinishTrick(G);
        await collectTrick(winner); check(my);
        renderAll();
      }
    }
    G.turn = null; renderSeats();
    const row = E.hScoreHand(G);
    renderBar();
    const mw = E.hMatchWinner(G);
    const go = await waitSheet(scoreSheetHTML(row, mw));
    check(my);
    if (go === 'home') return showHome();
    if (go === 'again') return startGame('h');
  }
}
function humanBid(isDealer) {
  const t = L();
  status(isDealer ? t.mustCall : t.callPrompt);
  return new Promise(res => {
    const btns = [0, 1, 2, 3].map(s => `<button data-s="${s}">${Cards.suitIcon('h', s, 20)}${suitName('h', s)}</button>`).join('');
    setAction(`<div class="msg">${isDealer ? t.mustCall : t.callPrompt}</div><div class="bid">${btns}<button class="pass" data-s="-1" ${isDealer ? 'disabled' : ''}>${t.pass}</button></div>`);
    $('#action').querySelectorAll('button[data-s]').forEach(b => b.onclick = () => { if (b.disabled) return; setAction(''); res(+b.dataset.s); });
  });
}
function scoreSheetHTML(row, mw) {
  const t = L();
  const res = r => r.result === 'pass' ? t.pass_r : r.result === 'fall' ? t.fall_r : t.hang_r;
  const rows = G.rows.map((r, i) => {
    const ct = r.caller % 2;
    const cell = tm => {
      const v = r.add[tm];
      const fallen = r.result === 'fall' && ct === tm;
      return `<td>${fallen ? '<span class="x">—</span>' : v}</td>`;
    };
    const note = `${Cards.suitIcon('h', r.trump, 13)} ${t.callerShort}: ${ct === 0 ? t.we : t.they} · ${res(r)}${r.stiglja >= 0 ? ' · ' + t.stiglja : ''}${(r.declPts[0] + r.declPts[1]) ? ` · ${t.declPts} ${r.declPts[0] || r.declPts[1]}` : ''}`;
    return `<tr><td class="n">${i + 1}</td>${cell(0)}${cell(1)}<td class="note">${note}</td></tr>`;
  }).join('');
  const r = row;
  const head = mw >= 0 ? (mw === 0 ? t.matchWon : t.matchLost) : t.handTitle(G.rows.length);
  const detail = `<div class="decl">
     <div><span>${t.cardsPts}</span><b>${r.pts[0]} : ${r.pts[1]}</b></div>
     <div><span>${t.declPts}</span><b>${r.declPts[0]} : ${r.declPts[1]}</b></div>
     <div><span>${t.callerShort}: ${r.caller % 2 === 0 ? t.we : t.they}</span><b>${res(r)}${G.hang ? ` (${G.hang})` : ''}</b></div></div>`;
  return `<h3>${head}</h3>${detail}
    <div class="pisw"><table class="pis"><thead><tr><th></th><th>${t.we}</th><th>${t.they}</th><th></th></tr></thead><tbody>${rows}
    <tr class="tot"><td></td><td>${G.score[0]}</td><td>${G.score[1]}</td><td class="note">${t.target(G.opts.target)}</td></tr></tbody></table></div>
    <div class="btns">${mw >= 0 ? `<button class="sec" data-go="home">${t.home}</button><button class="pri" data-go="again">${t.again}</button>` : `<button class="pri" data-go="next">${t.next}</button>`}</div>`;
}
function showScore() {
  if (!G) return;
  const t = L();
  if (G.game === 'b') {
    openSheet(`<h3>${t.pisanka}</h3><div class="pisw"><table class="pis"><thead><tr><th></th><th>${t.we}</th><th>${t.they}</th></tr></thead><tbody>
      ${G.history.map((p, i) => `<tr><td class="n">${i + 1}</td><td>${p[0]}</td><td>${p[1]}</td></tr>`).join('')}
      <tr class="tot"><td></td><td>${G.wins[0]}</td><td>${G.wins[1]}</td></tr></tbody></table></div>
      <div class="btns"><button class="pri" id="sx">${t.close}</button></div>`, v => v.querySelector('#sx').onclick = closeSheet);
  } else {
    openSheet(`<h3>${t.pisanka}</h3><div class="pisw"><table class="pis"><thead><tr><th></th><th>${t.we}</th><th>${t.they}</th><th></th></tr></thead><tbody>
      ${G.rows.map((r, i) => `<tr><td class="n">${i + 1}</td><td>${r.result === 'fall' && r.caller % 2 === 0 ? '<span class="x">—</span>' : r.add[0]}</td><td>${r.result === 'fall' && r.caller % 2 === 1 ? '<span class="x">—</span>' : r.add[1]}</td><td class="note">${Cards.suitIcon('h', r.trump, 13)}</td></tr>`).join('')}
      <tr class="tot"><td></td><td>${G.score[0]}</td><td>${G.score[1]}</td><td class="note">${t.target(G.opts.target)}</td></tr></tbody></table></div>
      <div class="btns"><button class="pri" id="sx">${t.close}</button></div>`, v => v.querySelector('#sx').onclick = closeSheet);
  }
}

document.documentElement.lang = S.lang;
renderHome();
})();
