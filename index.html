    <div class="zlist">${rows || bela ? rows + bela : `<p class="muted">${t.declNone}</p>`}</div>
    <div class="decl"><div><span>${t.we} : ${t.they}</span><b>${tot[0]} : ${tot[1]}</b></div></div>
    <p class="muted small">${t.zvNote}</p>${close}`, bind);
}
function showScore() {
  if (!G) return;
  const t = L();
  if (G.game === 'b') {
    openSheet(`<h3>${t.pisanka}</h3><div class="pisw"><table class="pis"><thead><tr><th></th>${sideLabels().map(l => `<th>${esc(l)}</th>`).join('')}</tr></thead><tbody>
      ${G.history.map((p, i) => `<tr><td class="n">${i + 1}</td>${p.map(v => `<td>${v}</td>`).join('')}</tr>`).join('')}
      <tr class="tot"><td></td>${G.wins.map(w => `<td>${w}</td>`).join('')}</tr></tbody></table></div>
      <div class="btns"><button class="pri" id="sx">${t.close}</button></div>`, v => v.querySelector('#sx').onclick = closeSheet);
  } else if (G.game === 't') {
    openSheet(`<h3>${t.pisanka}</h3>${tTable()}<div class="btns"><button class="pri" id="sx">${t.close}</button></div>`, v => v.querySelector('#sx').onclick = closeSheet);
  } else {
    openSheet(`<h3>${t.pisanka}</h3><div class="pisw"><table class="pis"><thead><tr><th></th><th>${t.we}</th><th>${t.they}</th><th></th></tr></thead><tbody>
      ${G.rows.map((r, i) => `<tr><td class="n">${i + 1}</td><td>${r.result === 'fall' && r.caller % 2 === 0 ? '<span class="x">—</span>' : r.add[0]}</td><td>${r.result === 'fall' && r.caller % 2 === 1 ? '<span class="x">—</span>' : r.add[1]}</td><td class="note">${Cards.suitIcon('h', r.trump, 13)}</td></tr>`).join('')}
      <tr class="tot"><td></td><td>${G.score[0]}</td><td>${G.score[1]}</td><td class="note">${t.target(G.opts.target)}</td></tr></tbody></table></div>
      <div class="btns"><button class="pri" id="sx">${t.close}</button></div>`, v => v.querySelector('#sx').onclick = closeSheet);
  }
}

// ================= TREŠETA =================
let mySig = null;
function showSignals() {
  if (!(G && G.game === 't' && G.opts.signals && G.seats.length === 4)) return;
  const t = L(), lead = G.trick.length === 0;
  const opts = lead ? ['kucam', 'strisco'] : ['volo', 'strisco'];
  setAction(`<div class="msg">${t.yourTurn}</div><div class="sigs">${opts.map(k => `<button class="sig" data-sig="${k}" aria-pressed="false">${t.sigName[k]}</button>`).join('')}</div>`);
  $('#action').querySelectorAll('.sig').forEach(b => b.onclick = () => {
    mySig = mySig === b.dataset.sig ? null : b.dataset.sig;
    $('#action').querySelectorAll('.sig').forEach(x => x.setAttribute('aria-pressed', x.dataset.sig === mySig));
  });
}
function tTable() {
  const t = L();
  return `<div class="pisw"><table class="pis"><thead><tr><th></th><th>${t.we}</th><th>${t.they}</th><th></th></tr></thead><tbody>
    ${G.rows.map((r, i) => `<tr><td class="n">${i + 1}</td><td>${r.add[0]}</td><td>${r.add[1]}</td><td class="note">${(r.akuze[0] + r.akuze[1]) ? `${t.akuzaPts} ${r.akuze[0]}:${r.akuze[1]}` : ''}</td></tr>`).join('')}
    <tr class="tot"><td></td><td>${G.score[0]}</td><td>${G.score[1]}</td><td class="note">${t.target(G.opts.target)}</td></tr></tbody></table></div>`;
}
async function tresetaMatch(my) {
  const t = () => L();
  while (true) {
    G.dealer = E.nextSeat(G, G.dealer);
    E.tDeal(G); G.turn = null;
    $('#center').innerHTML = '';
    renderAll(); status('');
    await sleep(SPEED().deal); check(my);
    // akuže are announced before the first card
    let any = false;
    for (const s of E.roundFrom(G, G.leader)) {
      const ds = G.akuze[s]; if (!ds.length) continue;
      any = true;
      bubble(s, `${t().akuza}: ${ds.map(d => t().akuzaName(d)).join(', ')} +${ds.reduce((x, d) => x + d.val, 0)}`, true, 2600);
      await sleep(SPEED().ai * 0.8); check(my);
    }
    if (any) { await sleep(SPEED().trick); check(my); }
    while (!E.tHandOver(G)) {
      const s = E.tToPlay(G);
      await turnTo(s);
      let card;
      let sig = null;
      if (s === 0) { showSignals(); card = await humanPick(E.tLegal(G, 0).map(c => c.id)); sig = mySig; mySig = null; }
      else { await sleep(SPEED().ai); card = E.tAI(G, s); sig = E.tAISignal(G, s, card); }
      check(my);
      if (sig && G.opts.signals && G.seats.length === 4) bubble(s, t().sigName[sig], sig === 'kucam', 1600);
      const done = E.tPlay(G, s, card, sig);
      placeTrickCard(s, card); renderSeats(); renderHand();
      if (done) {
        G.turn = null; renderSeats(); status('');
        await sleep(SPEED().trick); check(my);
        const { winner, draws } = E.tFinishTrick(G);
        await collectTrick(winner); check(my);
        renderAll();
        // two players: the card each player draws is shown to the other
        const theirs = draws.find(d => d.seat !== 0);
        if (theirs) { bubble(theirs.seat, `${t().drew}<span class="svgc mini-card">${face('t', theirs.card)}</span>`, false, 1500); await sleep(SPEED().ai * 0.6); check(my); }
      }
    }
    G.turn = null; renderSeats();
    const r = E.tScoreHand(G);
    renderBar();
    const mw = E.tMatchWinner(G);
    const head = mw >= 0 ? (mw === 0 ? t().matchWon : t().matchLost) : t().handTitle(G.rows.length);
    const go = await waitSheet(`<h3>${head}</h3>
      <div class="decl"><div><span>${t().cardsPts}</span><b>${r.cardPts[0]} : ${r.cardPts[1]}</b></div>
      <div><span>${t().akuzaPts}</span><b>${r.akuze[0]} : ${r.akuze[1]}</b></div></div>
      ${tTable()}
      <div class="btns">${mw >= 0 ? `<button class="sec" data-go="home">${t().home}</button><button class="pri" data-go="again">${t().again}</button>` : `<button class="pri" data-go="next">${t().next}</button>`}</div>`);
    check(my);
    if (go === 'home') return showHome();
    if (go === 'again') return startGame('t');
  }
}

addEventListener('resize', () => { if (G) layoutSizes(); });
document.documentElement.lang = S.lang;
renderHome();
})();
