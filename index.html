      <button class="ib" id="uHome" aria-label="${api.L().sol.home}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="chip score" id="uScore"></div>
      <button class="ib" id="uRules" aria-label="${api.L().settings}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></header>
      <div class="utable"><div class="uopps" id="uOpps"></div>
      <div class="ucenter" id="uCenter">
        <div class="udir" id="uDir">${DIR_SVG}</div>
        <button class="upile" id="uDraw" aria-label="${T().draw}"></button>
        <div class="upile udisc" id="uDisc"></div>
        <div class="upend" id="uPend" hidden></div>
      </div></div>
      <div class="uact" id="uAct"></div>
      <div class="uhand" id="uHand"></div>`;
    $('#uHome').onclick = leave;
    $('#uRules').onclick = () => api.showOpts('u');
    $('#uDraw').onclick = () => human({ draw: true });
    $('#uHand').onclick = e => { const el = e.target.closest('.ucard'); if (el) tapCard(+el.dataset.id); };
    $('#uOpps').onclick = e => { const el = e.target.closest('.ucatch'); if (el) human({ catch: +el.dataset.p }); };
    $('#uAct').onclick = e => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.c) { if (colorWait) { const r = colorWait; colorWait = null; renderAct(); r(b.dataset.c); } return; }
      if (b.dataset.a) human({ [b.dataset.a]: true });
    };
  }

  // ---------------------------------------------------------------- drawing
  // seats around the table in playing order: the next player sits on my left, then across the top, then down the right
  const SEATS = {
    1: [[50, 10]],
    2: [[12, 76], [88, 76]],
    3: [[12, 76], [50, 10], [88, 76]],
    4: [[12, 76], [28, 11], [72, 11], [88, 76]],
    5: [[12, 76], [12, 27], [50, 10], [88, 27], [88, 76]]
  };
  const seatXY = p => p === 0 ? [50, 100] : p < 0 ? [50, 50] : SEATS[st.n - 1][p - 1];
  // where a card lands on the discard pile: nudged toward the player who threw it
  let played = new Map();   // card id -> seat
  function landing(id) {
    const p = played.has(id) ? played.get(id) : -1;
    if (p < 0) return { x: 0, y: 0, r: 0 };
    const [x, y] = seatXY(p), dx = x - 50, dy = y - 50, d = Math.hypot(dx, dy) || 1;
    let h = 0; for (const ch of String(id)) h = (h * 31 + ch.charCodeAt(0)) % 997;
    const k = 0.2 * (parseFloat(getComputedStyle(root).getPropertyValue('--pw')) || $('#uDisc').offsetWidth || 90);
    return { x: dx / d * k, y: dy / d * k, r: (h % 17) - 8 };
  }
  function render() {
    if (!st || !root) return;
    const t = T();
    $('#uScore').innerHTML = st.opts.target ? `<span>${t.you}</span><b>${st.scores[0]}</b><small>/ ${st.opts.target}</small>` : (api.S.lang === 'hr' ? `<b>${st.round}.</b><small>${t.round}</small>` : `<small>${t.round}</small><b>${st.round}</b>`);
    // opponents, in the order they play after me
    seatOrder = []; for (let i = 1; i < st.n; i++) seatOrder.push(i);
    $('#uOpps').innerHTML = seatOrder.map(p => {
      const h = st.hands[p] || [], k = Math.min(h.length, 12);
      const fan = h.slice(0, k).map((c, i) => `<span class="umini" style="--i:${i};--k:${k}">${hidden(c)}</span>`).join('');
      const vul = catchState && catchState.p === p;
      const [x, y] = seatXY(p);
      return `<div class="uopp${st.turn === p && st.winner === null ? ' turn' : ''}${st.eliminated?.[p] ? ' eliminated' : ''}" data-p="${p}" style="--x:${x};--y:${y}">
        <div class="ufan">${fan}</div>
        <div class="uname"><b>${esc(nm(p))}</b><span class="ucount">${st.eliminated?.[p] ? t.eliminated : h.length}</span>${st.uno[p] && h.length === 1 ? `<span class="ulast">!</span>` : ''}</div>
        ${st.opts.target ? `<small class="upts">${st.scores[p]}</small>` : ''}
        ${vul ? `<button class="ucatch" data-p="${p}">${t.catch}</button>` : ''}</div>`;
    }).join('');
    // piles
    const topCard = st.discard[st.discard.length - 1];
    // the last round of plays stays visible, each card skewed toward whoever threw it
    const keep = Math.min(st.n, 5), last = st.discard.slice(-keep);
    $('#uDisc').innerHTML = last.map((c, i) => {
      const l = landing(c.id), top = i === last.length - 1;
      return `<div class="ucard big${top ? ' top' : ' old'}" style="--dx:${l.x.toFixed(1)}px;--dy:${l.y.toFixed(1)}px;--r:${l.r}deg">${shown(c)}</div>`;
    }).join('');
    const ring = st.color ? HEX[st.color] : 'transparent';
    $('#uDisc').style.setProperty('--ring', ring);
    $('#uDraw').innerHTML = st.draw.length ? `<div class="ucard big">${hidden(st.draw[st.draw.length - 1])}</div><span class="uleft">${st.draw.length}</span>` : '';
    $('#uDir').classList.toggle('ccw', st.dir < 0);
    $('#uDir').style.color = ring === 'transparent' ? 'rgba(255,255,255,.3)' : ring;
    const pend = $('#uPend'); pend.hidden = !st.pending; pend.textContent = st.pending ? '+' + st.pending : '';
    renderHand(); renderAct();
  }
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const ORDER = { L: ['r', 'y', 'g', 'b', null], D: ['p', 't', 'o', 'v', null] };
  const KORD = ['n', 'd1', 'd2', 'd4', 'd5', 'skip', 'skipall', 'discardall', 'rev', 'flip', 'wild', 'wd2', 'wd4', 'wr4', 'wd6', 'wd10', 'roulette', 'wdc'];
  function sortedHand() {
    const o = ORDER[st.side];
    return st.hands[0].slice().sort((a, b) => { const fa = a[st.side], fb = b[st.side]; return o.indexOf(fa.c) - o.indexOf(fb.c) || KORD.indexOf(fa.k) - KORD.indexOf(fb.k) || (fa.n || 0) - (fb.n || 0); });
  }
  function playableIds() {
    if (jumpWait) return new Set(U.jumpInCards(st, 0).map(c => c.id));
    if (!wait) return new Set();
    if (wait.drawn) return new Set([wait.drawn.id]);
    return new Set(U.legal(st, 0).map(c => c.id));
  }
  function renderHand() {
    const el = $('#uHand'); const cs = sortedHand(); const ok = playableIds();
    const W = el.clientWidth || 360, n = cs.length;
    const cw = Math.min(78, Math.max(52, W / 5.2)), step = n > 1 ? Math.min(cw * 0.78, (W - cw - 8) / (n - 1)) : 0;
    const total = cw + step * Math.max(0, n - 1), x0 = (W - total) / 2;
    el.style.setProperty('--cw', cw + 'px');
    el.classList.toggle('myturn', !!wait);
    el.innerHTML = cs.map((c, i) => `<button class="ucard${ok.has(c.id) ? ' ok' : ''}" data-id="${c.id}" style="left:${(x0 + i * step).toFixed(1)}px;z-index:${i + 1}">${shown(c)}</button>`).join('');
  }
  function renderAct() {
    const t = T(), a = [];
    if (st.eliminated?.[0]) { $('#uAct').innerHTML = `<span class="muted">${t.eliminated}</span>`; return; }
    if (colorWait) {
      $('#uAct').innerHTML = `<div class="ucolrow">${U.COLORS[st.side].map(c => `<button data-c="${c}" style="--c:${HEX[c]}" aria-label="${t.cols[c]}"><svg viewBox="-6 -6 12 12" fill="#fff">${SYM[c]}</svg></button>`).join('')}</div>`;
      return;
    }
    const lastOk = st.winner === null && ((st.turn === 0 && wait && st.hands[0].length === 2 && U.legal(st, 0).length) || U.vulnerable(st, 0)) && !st.uno[0];
    a.push(`<button class="ubtn last" data-a="last" ${lastOk ? '' : 'disabled'}>${t.last}</button>`);
    if (wait && wait.drawn) a.push(`<button class="ubtn" data-a="pass">${t.pass}</button>`);
    $('#uAct').innerHTML = a.join('');
  }

  // ---- animation: a card flies from one element to another
  function rectOf(el) { const r = el.getBoundingClientRect(); return { x: r.left, y: r.top, w: r.width, h: r.height }; }
  async function fly(fromEl, toEl, html, ms = 320, off) {
    if (!fromEl || !toEl) return;
    const a = rectOf(fromEl), b = rectOf(toEl);
    off = off || { x: 0, y: 0, r: 0 };
    const d = document.createElement('div'); d.className = 'ufly'; d.innerHTML = html;
    d.style.width = b.w + 'px'; d.style.height = b.h + 'px'; root.appendChild(d);
    const sx = a.w / b.w;
    const anim = d.animate([{ transform: `translate(${a.x}px,${a.y}px) scale(${sx})` }, { transform: `translate(${b.x + off.x}px,${b.y + off.y}px) scale(1) rotate(${off.r}deg)` }], { duration: ms * speed(), easing: 'cubic-bezier(.2,.8,.3,1)' });
    await anim.finished.catch(() => {}); d.remove();
  }
  const oppEl = p => root.querySelector(`.uopp[data-p="${p}"]`);
  async function animPlay(fx) {
    const from = fx.p === 0 ? (root.querySelector(`.ucard[data-id="${fx.card.id}"]`) || $('#uHand')) : oppEl(fx.p);
    played.set(fx.card.id, fx.p);
    const html = `<div class="ucard big">${cardFace(fx.card, fx.flipped ? (st.side === 'L' ? 'D' : 'L') : st.side)}</div>`;
    if (fx.p === 0 && from && from.classList) from.style.visibility = 'hidden';
    await fly(from, $('#uDisc'), html, 300, landing(fx.card.id));
  }
  async function animDraw(p, k) {
    const src = $('#uDraw'), dst = p === 0 ? $('#uHand') : oppEl(p);
    for (let i = 0; i < Math.min(k, 6); i++) { fly(src, dst, `<div class="ucard big">${BACK}</div>`, 280); await sleep(70 * speed()); }
    await sleep(240 * speed());
  }
  async function showFx(fx) {
    if (fx.flipped) { root.classList.add('uflip'); await sleep(420 * speed()); root.classList.remove('uflip'); }
    render();
    for (const p in fx.drew) if (fx.drew[p]) await animDraw(+p, fx.drew[p]);
    if (fx.caught !== undefined) api.toast(`${nm(fx.caught)} +${fx.drew[fx.caught] || ''}`);
    if (fx.swap || fx.rotate) await sleep(400 * speed());
    render();
  }

  // ---------------------------------------------------------------- input
  function human(a) {
    if (a.last) { if (st && !st.uno[0] && (st.hands[0].length <= 2)) { U.callUno(st, 0); if (catchState && catchState.p === 0) catchState.saved = true; api.toast(T().last); render(); } return; }
    if (a.catch !== undefined) { if (catchState && catchState.p === a.catch && !catchState.done) { catchState.done = true; catchState.by = 0; if (catchState.wake) catchState.wake(); } return; }
    if (jumpWait && a.card) { const r = jumpWait; jumpWait = null; r(a); return; }
    if (!wait) return;
    if (a.draw && wait.drawn) return;
    if (a.pass && !wait.drawn) return;
    const r = wait.res; wait = null; r(a);
  }
  function tapCard(id) {
    if (!st) return;
    const ok = playableIds();
    if (!ok.has(id)) { const el = root.querySelector(`.ucard[data-id="${id}"]`); if (el) el.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-4px)' }, { transform: 'translateX(4px)' }, { transform: 'translateX(0)' }], { duration: 200 }); return; }
    const card = st.hands[0].find(c => c.id === id);
    human({ card });
  }
  const waitHuman = extra => new Promise(res => { wait = { res, ...extra }; render(); });
  // the colour for a wild card is picked just above the hand, so the hand stays in view
  let colorWait = null;
  function askColor() { return new Promise(res => { colorWait = res; renderAct(); }); }
  function askSwap() {
    const t = T();
    return new Promise(res => api.openSheet(`<h3>${t.swap}</h3><div class="btns col">${seatOrder.filter(p => !st.eliminated[p]).map(p => `<button class="sec" data-p="${p}">${esc(nm(p))} · ${st.hands[p].length}</button>`).join('')}</div>`, v => {
      v.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { api.closeSheet(); res(+b.dataset.p); });
    }));
  }
  function askChallenge(c) {
    const t = T(), k = c.k === 'color' ? '+?' : '+' + c.k;
    return new Promise(res => api.openSheet(`<h3>${esc(nm(c.from))} · ${k}</h3><div class="btns"><button class="sec" id="uAcc">${t.take} ${k}</button><button class="pri" id="uCh">${t.challenge}</button></div>`, v => {
      v.querySelector('#uAcc').onclick = () => { api.closeSheet(); res(false); };
      v.querySelector('#uCh').onclick = () => { api.closeSheet(); res(true); };
    }));
  }

  // ---------------------------------------------------------------- the game
  async function run(my, cont) {
    while (true) {
      if (cont === 'turn') { cont = null; catchState = null; if (!played) played = new Map(); render(); await sleep(250); check(my); }
      else {
      cont = null;
      U.newRound(st); catchState = null; played = new Map();
      // a Draw card turned first: the first player draws and misses the turn (shown after the deal)
      const sp = st.start, extra = sp.n ? st.hands[sp.p].splice(st.hands[sp.p].length - sp.n) : [];
      render();
      await dealAnim(my);
      if (extra.length) {
        await sleep(350 * speed()); check(my);
        st.hands[sp.p].push(...extra); render(); api.toast(`${nm(sp.p)} +${extra.length}`);
        await animDraw(sp.p, extra.length); check(my);
      }
      }
      while (st.winner === null) {
        check(my);
        if (st.mustChooseColor !== null && st.mustChooseColor !== undefined) {
          const p = st.mustChooseColor;
          st.color = p === 0 ? await askColor() : U.bestColor(st, p); st.mustChooseColor = null; render(); continue;
        }
        if (st.pendingChallenge) {
          const c = st.pendingChallenge;
          const ch = c.to === 0 ? await askChallenge(c) : (await sleep(500 * react()), U.botChallenge(st, c.to, levels[c.to]));
          check(my);
          if (ch && c.to !== 0) api.toast(`${nm(c.to)}: ${T().challenge}`);
          const fx = U.resolveChallenge(st, ch); await showFx(fx); continue;
        }
        const p = st.turn;
        ckpt('turn');
        if (p === 0) await humanTurn(my); else await botTurn(p, my);
      }
      check(my);
      await sleep(600 * speed());
      const again = await roundEnd();
      check(my);
      if (!again) return;
    }
  }
  async function dealAnim(my) {
    const hand = $('#uHand'); hand.style.opacity = 0;
    await sleep(150); hand.style.opacity = ''; hand.animate([{ transform: 'translateY(40px)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 300 });
    await sleep(350 * speed()); check(my);
  }
  async function afterPlay(fx, my) {
    await showFx(fx);
    if (fx.out) return;
    // a player left with one card who did not call it can be caught
    if (U.vulnerable(st, fx.p)) await catchWindow(fx.p, my);
    await botJumpIns(fx.p, my);
  }
  async function humanTurn(my) {
    const a = await waitHuman(); check(my);
    if (a.draw) {
      const r = U.drawTurn(st, 0); render();
      await animDraw(0, r.cards.length); render();
      if (r.ended || r.penalty || !r.playable) return;
      const a2 = await waitHuman({ drawn: r.playable }); check(my);
      if (a2.pass || !a2.card) { U.passAfterDraw(st, 0); render(); return; }
      return humanPlay(a2.card, my);
    }
    return humanPlay(a.card, my);
  }
  async function humanPlay(card, my) {
    const f = U.face(st, card); let color = null;
    if (U.isWild(f)) { color = await askColor(); check(my); }
    if ((st.opts.sevenO || st.variant === 'nomercy') && f.k === 'n' && f.n === 7 && st.hands[0].length > 1) { st.sevenTarget = await askSwap(); check(my); }
    const fx = U.play(st, 0, card, color);
    await animPlay(fx); await afterPlay(fx, my);
  }
  async function botTurn(p, my) {
    render();
    // while a bot thinks, an identical card can jump in
    const jumped = await thinkOrJump((650 + Math.random() * 300) * react(), my);
    if (jumped) return;
    check(my);
    const lv = levels[p], ch = U.botMove(st, p, lv);
    if (ch) {
      if (st.hands[p].length === 2 && U.botCallsUno(lv)) U.callUno(st, p);
      const fx = U.play(st, p, ch.card, ch.color);
      await animPlay(fx); await afterPlay(fx, my); return;
    }
    const r = U.drawTurn(st, p); render();
    await animDraw(p, r.cards.length); render();
    if (r.ended || r.penalty || !r.playable) return;
    await sleep(350 * speed()); check(my);
    if (U.botPlayDrawn(st, p, r.playable, lv)) {
      if (st.hands[p].length === 2 && U.botCallsUno(lv)) U.callUno(st, p);
      const fx = U.play(st, p, r.playable, U.bestColor(st, p));
      await animPlay(fx); await afterPlay(fx, my);
    } else { U.passAfterDraw(st, p); render(); }
  }
  async function thinkOrJump(ms, my) {
    if (!st.opts.jumpIn || !U.jumpInCards(st, 0).length) { await sleep(ms); return false; }
    const a = await new Promise(res => { jumpWait = res; render(); setTimeout(() => { if (jumpWait === res) { jumpWait = null; res(null); } }, ms); });
    check(my); render();
    if (!a || !a.card) return false;
    const fx = U.play(st, 0, a.card, null);
    await animPlay(fx); await afterPlay(fx, my);
    return true;
  }
  async function botJumpIns(last, my) {
    if (!st.opts.jumpIn || st.winner !== null) return;
    for (let q = 1; q < st.n; q++) {
      if (q === last) continue;
      const cs = U.jumpInCards(st, q);
      if (!cs.length || !U.botJumpIn(levels[q]) || Math.random() < 0.5) continue;
      await sleep(300 * react()); check(my);
      if (!U.jumpInCards(st, q).length) continue;
      const fx = U.play(st, q, cs[0], null);
      await animPlay(fx); await afterPlay(fx, my);
      return;
    }
  }
  // the window to catch a missed call: the others (and you) can react
  async function catchWindow(p, my) {
    const cs = catchState = { p, done: false, saved: false };
    const delays = [];
    for (let q = 1; q < st.n; q++) if (q !== p && U.botCatches(levels[q])) delays.push({ q, ms: ({ novice: 1500, average: 1100, pro: 800, cardshark: 650 })[levels[q]] * (0.8 + Math.random() * 0.5) });
    // a bot that forgot may still call it in time
    if (p !== 0 && Math.random() < 0.3) delays.push({ q: -1, ms: 500 + Math.random() * 600 });
    const win = (p === 0 ? 1300 : 1700) * react();
    render();
    await new Promise(res => {
      cs.wake = res;
      setTimeout(res, win);
      delays.forEach(d => setTimeout(() => { if (!cs.done && !cs.saved) { if (d.q < 0) { cs.saved = true; U.callUno(st, p); } else { cs.done = true; cs.by = d.q; } res(); } }, d.ms * react()));
    });
    check(my);
    catchState = null;
    if (cs.done && !cs.saved && U.vulnerable(st, p)) {
      U.catchUno(st, p);
      api.toast(`${nm(cs.by)} → ${nm(p)} +2`);
      render(); await animDraw(p, 2);
    }
    render();
  }

  // ---------------------------------------------------------------- end of a round / match
  function roundEnd() {
    const t = T(), w = st.winner;
    const rows = [];
    for (let i = 0; i < st.n; i++) { const pts = st.hands[i].reduce((x, c) => x + U.cardPoints(st, c), 0); rows.push({ i, left: st.hands[i].length, pts }); }
    const total = rows.reduce((x, r) => x + (r.i === w ? 0 : r.pts), 0);
    const over = st.matchOver;
    if (over) clearSave(); else ckpt('round');
    if (over) record(st.scores.indexOf(Math.max(...st.scores)) === 0);
    const order = [...rows].sort((a, b) => st.scores[b.i] - st.scores[a.i]);
    const champ = over ? st.scores.indexOf(Math.max(...st.scores)) : w;
    return (over ? api.fx(champ === 0, { cards: champ === 0 ? [] : [$('#uDisc')] }) : Promise.resolve()).then(() => new Promise(res => api.openSheet(`<h3>${over ? t.matchWon(esc(nm(champ))) : t.roundWon(esc(nm(w)))}</h3>
      <table class="pis utab"><thead><tr><th></th><th>${t.left}</th>${st.opts.target ? `<th>${t.total}</th>` : ''}</tr></thead><tbody>
      ${order.map(r => `<tr${r.i === w ? ' class="w"' : ''}><td>${esc(nm(r.i))}</td><td>${r.i === w ? `+${total}` : st.eliminated?.[r.i] ? t.eliminated : `${r.left} · ${r.pts}`}</td>${st.opts.target ? `<td><b>${st.scores[r.i]}</b></td>` : ''}</tr>`).join('')}
      </tbody></table>
      <div class="btns">${over ? `<button class="sec" id="uMenu">${api.L().sol.home}</button><button class="pri" id="uNew">${t.again}</button>` : `<button class="pri" id="uNext">${t.next}</button>`}</div>`, v => {
      const n = v.querySelector('#uNext'); if (n) n.onclick = () => { api.closeSheet(); res(true); };
      const m = v.querySelector('#uMenu'); if (m) m.onclick = () => { res(false); leave(); };
      const a = v.querySelector('#uNew'); if (a) a.onclick = () => { res(false); start(); };
    })));
  }
  function record(won) {

      const done = E.tPlay(G, s, card, sig);
      placeTrickCard(s, card); renderSeats(); renderHand();
      if (done) {
        G.turn = null; renderSeats(); status('');

        const { winner, draws } = E.tFinishTrick(G);
        await collectTrick(winner); check(my);
        renderAll();
        // two players: the card each player draws is shown to the other
        const theirs = draws.find(d => d.seat !== 0);
        if (theirs) { bubble(theirs.seat, `${t().drew}<span class="svgc mini-card">${face('t', theirs.card)}</span>`, false, 1500); await sleep(SPEED().ai * 0.6); check(my); }
      }
    }
    G.turn = null; renderSeats();
    const r = E.tScoreHand(G);
    renderBar();
    const mw = E.tMatchWinner(G);
    if (mw >= 0) { recordMatch(mw === 0); clearSave(); } else ckpt('handEnd');
    if (mw >= 0) { await matchResultFx(mw === 0, { cards: mw === 0 ? [] : finalTrickCards() }); check(my); }

      <div class="decl"><div><span>${t().cardsPts}</span><b>${r.cardPts[0]} : ${r.cardPts[1]}</b></div>
